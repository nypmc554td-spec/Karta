<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EFEDE7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Karta">
<title>Karta drogowa</title>
<style>
:root{
  --bg:#EFEDE7; --panel:#FFFFFF; --panel2:#FBFAF6; --line:#D3D6DB;
  --ink:#15181C; --dim:#6A727C; --amber:#B77400; --green:#2F7D4F; --red:#C6402A;
  --r:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
/* ---------- Top bar ---------- */
header{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.brand b{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:700}
.brand small{color:var(--dim);font-size:11px;letter-spacing:.08em;margin-left:auto}
.bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.bar::-webkit-scrollbar{display:none}
.btn{
  flex:0 0 auto;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;cursor:pointer;
}
.btn:active{background:#E4E2DB}
.btn.primary{background:var(--amber);color:#fff;border-color:var(--amber)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red)}
/* ---------- Tabs ---------- */
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px 0;position:sticky;top:0;z-index:40;background:var(--bg)}
nav::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:9px 13px;border-radius:10px 10px 0 0;background:transparent;
  border:1px solid transparent;border-bottom:none;color:var(--dim);font-size:14px;font-weight:600;cursor:pointer;
}
.tab.on{background:var(--panel);color:var(--amber);border-color:var(--line)}
main{padding:0 12px 90px}
section.pane{display:none}
section.pane.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0}
.card > h3{
  margin:0 0 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .full{grid-column:1/-1}
label.f{display:block}
label.f > span{display:block;font-size:11px;color:var(--dim);margin:0 0 3px 2px;letter-spacing:.03em}
input,textarea,select{
  width:100%;background:#FFFFFF;border:1px solid #C7CBD1;border-radius:10px;
  color:var(--ink);font:16px/1.2 inherit;padding:11px 10px;appearance:none;-webkit-appearance:none;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber)}
body.hl input.empty,body.hl textarea.empty,body.hl select.empty{background:#FFF6DE;border-color:#E3C489}
body.hl input.empty:focus,body.hl textarea.empty:focus,body.hl select.empty:focus{background:#FFFFFF}
@media print{ input.empty,textarea.empty,select.empty{background:#fff !important;border-color:#C7CBD1 !important} }
input[type=date],input[type=time]{min-height:44px}
textarea{min-height:90px;line-height:1.35}
.row2{display:flex;gap:6px}
.row2 > *{flex:1}
.mini{
  flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--amber);
  border-radius:9px;padding:0 10px;font-size:12px;font-weight:700;cursor:pointer;min-height:44px;
}
.mini:active{background:var(--panel2)}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
/* мягкая заливка строк: жёлтая — не закрыта, зелёная — заполнено всё */
.item[data-row].todo{background:#FFFFFF;border-color:#D3D6DB}
.item[data-row].done{background:#E4F2E8;border-color:#8CC5A2}
/* закрытая строка — белая полоска, как на бланке */
.rsum{display:none}
.item.fold{padding:8px}
.item.fold .grid,.item.fold .sub,.item.fold .add{display:none}
.item.fold .ihead{margin-bottom:6px}
.item.fold .rsum{display:block;background:#F4FBF6;color:#15181c;border:1px solid #A9D6BB;border-radius:6px;
  padding:6px 9px;font-size:12.5px;line-height:1.45;font-family:"Times New Roman",Georgia,serif;cursor:pointer}
.rsum b{font-weight:700}
.rsum .sep{color:#7a808a;padding:0 5px}
.fbtn{margin-left:auto;background:#E4F2E8;border:1px solid #8CC5A2;color:#1F6B41;
  font-size:12px;font-weight:700;border-radius:999px;padding:5px 12px;cursor:pointer}
.item.fold .fbtn{background:#fff;border-color:#C9CDD3;color:#5A6069}
.item .ihead .fbtn + .del{margin-left:6px}
.rst{font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:999px;text-transform:uppercase}
.rst.done{color:#1F6B41}
.rst.todo{color:#8A5A00}
.item .ihead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.item .ihead b{font-size:12px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.item .ihead .del{margin-left:auto;background:transparent;border:none;color:var(--red);font-size:13px;font-weight:700;cursor:pointer;padding:4px 6px}
.sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:14px 0 4px 2px;display:flex;align-items:center;gap:8px}
.hint{color:var(--dim);font-size:12px;line-height:1.5;margin:8px 2px}
.count{color:var(--dim);font-size:12px;margin-left:auto}
/* --- цветовые шапки секций заправок --- */
.card.sec > h3{
  display:flex;align-items:center;gap:8px;
  margin:-12px -12px 12px;padding:10px 12px;
  border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0;
  border-bottom:1px solid;
}
.card.sec > h3 .count{color:inherit;opacity:.72}
.sec-on  > h3{background:#E4F0E6;color:#256640;border-bottom-color:#C4DDC9}
.sec-ad  > h3{background:#E4ECF7;color:#28527F;border-bottom-color:#C6D6EB}
.sec-chl > h3{background:#F1E9F5;color:#5B3F77;border-bottom-color:#DDCFE6}
.add{width:100%;margin-top:6px;background:transparent;border:1px dashed var(--line);color:var(--amber);
  border-radius:12px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
.bkwarn{margin:10px 12px 0;padding:11px 12px;border-radius:12px;background:#FDF3DC;border:1px solid #E0BE72;
  color:#5A4413;font-size:13px;line-height:1.45;display:flex;gap:10px;align-items:center}
.bkwarn button{flex:0 0 auto;background:var(--amber);color:#fff;border:none;border-radius:9px;padding:9px 12px;font-weight:700;font-size:13px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
  background:var(--green);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;
  z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.instr{color:#2A3138;font-size:14px;line-height:1.55}
.instr li{margin:0 0 12px}
.instr h4{color:var(--amber);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}
.sigpad{width:100%;height:140px;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none;display:block;cursor:crosshair}
.sigwrap{margin:6px 0 12px}
.sigrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.sigrow .mini{min-height:38px}
.mini.on{background:#25664011;border-color:#8CC5A2;color:#1F6B41;font-weight:700}
.add.sm{padding:8px;font-size:13px;margin-top:2px}
.sub .del{margin-left:auto;position:relative;top:-1px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

.bkwarn{margin:10px 12px 0;padding:11px 12px;border-radius:12px;background:#FDF3DC;border:1px solid #E0BE72;
  color:#5A4413;font-size:13px;line-height:1.45;display:flex;gap:10px;align-items:center}
.bkwarn button{flex:0 0 auto;background:var(--amber);color:#fff;border:none;border-radius:9px;padding:9px 12px;font-weight:700;font-size:13px}

/* ================= PRINT SHEET (точная копия бланка) ================= */
#print{position:absolute;left:-99999px;top:0;width:680px;background:#fff;color:#000}
.page{width:680px;height:880px;overflow:hidden;background:#fff;margin:0 auto 10px}
.sheet{
  width:680px;min-height:880px;background:#fff;
  font-family:"Times New Roman",Times,serif;color:#000;
  display:flex;flex-direction:column;overflow:hidden;
}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed}
.sheet td,.sheet th{border:1px solid #000;padding:1px 3px;vertical-align:middle;font-size:9pt;line-height:1.15;word-wrap:break-word}
.b{font-weight:bold}
.c{text-align:center}
.i{font-style:italic}
.nb td{border:none}
.val{font-family:"Courier New",monospace;font-size:8.5pt}
.fitv{display:block;white-space:nowrap;overflow:hidden}
.fitv.c{text-align:center}
.h1{text-align:center;font-weight:bold;font-size:12pt;margin:0 0 6px}
.h2{text-align:center;font-weight:bold;font-style:italic;font-size:10.5pt;margin:8px 0 4px}
.decl{font-style:italic;font-weight:bold;text-decoration:underline;font-size:10pt;margin:8px 0 2px;text-align:center}
.trasa td{height:5.1mm;font-size:7.5pt}
.trasa th{font-size:7.5pt;font-weight:bold;text-align:center}
.tank{font-family:Arial,Helvetica,sans-serif}
.tank td,.tank th{font-size:8pt;height:5.2mm}
.tank th{font-weight:bold;text-align:center}
.lines{border:1px solid #000;padding:3px 5px}
.lines div{font-size:9pt;line-height:1.5;white-space:nowrap;overflow:hidden}
.dot{letter-spacing:.5px}
.sig{margin-top:auto;padding-top:6mm;display:flex;justify-content:space-between;align-items:flex-start;font-weight:bold;font-style:italic;font-size:10pt}
.sig > div{width:45%}
.sig .s2{margin-top:7mm}
.sig u{display:block;font-weight:normal;font-style:normal;margin-top:2px}
.sigbox{height:14mm;display:flex;align-items:flex-end}
.sigbox img{max-height:14mm;max-width:100%;display:block}
.note{font-size:9pt;font-weight:bold;margin-top:14px;line-height:1.35}
.rus{font-family:Arial,Helvetica,sans-serif;font-size:8pt;line-height:1.32}
.rus ul{margin:2mm 0 0;padding-left:6mm}
.rus li{margin-bottom:2.4mm;text-align:justify}
@media print{
  header,nav,main,.bkwarn,.toast{display:none!important}
  body{background:#fff}
  #print{position:static!important;left:auto!important;top:auto!important;padding:0!important;zoom:1!important}
  .page{margin:0;page-break-after:always;break-after:page;page-break-inside:avoid;break-inside:avoid}
  .page:last-child{page-break-after:auto;break-after:auto}
  @page{size:A4 portrait;margin:12mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
select.cur{flex:0 0 108px;padding-left:8px;padding-right:8px;font-size:15px}
.sumbadge{display:block;margin-top:4px;color:var(--amber);font-size:12px;min-height:14px}
.ctrow.tot{border-bottom:none;font-weight:700;padding-top:10px}
.ctrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.ctrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrow small{color:var(--dim);min-width:26px;text-align:right}
.mycard{display:inline-flex;align-items:center;gap:4px;background:var(--line);border-radius:8px;padding:3px 6px;margin:2px 4px 2px 0;font-size:13px}

/* ================= Итоги месяца ================= */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum-cell{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.sum-cell span{font-size:11px;color:var(--dim)}
.sum-cell b{display:block;font-size:21px;font-weight:700;margin-top:2px}
.sum-big{font-size:26px;font-weight:700;line-height:1.15}
.sum-note{font-size:12px;color:var(--dim);line-height:1.45}
.sum-flag{border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.45;margin-top:8px}
.sum-flag b{display:block;margin-bottom:2px}
.sum-flag.bad{background:#FBE8E4;border:1px solid #E0A697;color:#7A2A19}
.sum-flag.warn{background:#FDF3DC;border:1px solid #E0BE72;color:#5A4413}
.sum-flag.ok{background:#E7F2EA;border:1px solid #9CC4AB;color:#22553A}
.sum-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.sum-row:last-child{border-bottom:none}
.sum-row i{font-style:normal;color:var(--dim)}
/* графика — SVG, чтобы печаталась даже без фоновой заливки */
svg.chart{width:100%;display:block;height:18px}
svg.nchart{height:70px}
svg.bchart{height:15px}
.nb-full{fill:#C6402A}.nb-part{fill:#8A6BC4}.nb-zero{fill:#D3D6DB}
.ax{fill:#15181C;opacity:.3}
.sc-bg{fill:#E9E7E1}.sc-band{fill:#DCEBE1}.sc-fill{fill:#2F7D4F}.sc-mark{fill:#15181C}
.bar-a{fill:#B77400}
/* ---- тот же экран на печать: только чёрный, серый и линия ---- */
.sheet .nb-full{fill:#000}
.sheet .nb-part{fill:#8C8C8C}
.sheet .nb-zero{fill:#C8C8C8}
.sheet .ax{fill:#000;opacity:1}
.sheet .sc-bg{fill:#EDEDED}
.sheet .sc-band{fill:#D2D2D2}
.sheet .sc-fill{fill:#000}
.sheet .sc-mark{fill:#000}
.sheet svg.nchart{height:52px}
.ito{font-family:Arial,Helvetica,sans-serif}
.itohead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid #000;padding-bottom:5px;margin-bottom:9px}
.itotitle{font-size:13pt;font-weight:bold}
.itosub{font-size:8.5pt}
.itoh{font-size:8.5pt;font-weight:bold;border-bottom:1px solid #000;padding-bottom:2px;margin:11px 0 6px}
.itoboxes td{border:1px solid #000;padding:4px 5px;text-align:center;width:25%}
.itolab{font-size:7.5pt}
.itobig{font-size:13pt;font-weight:bold}
.itoax{display:flex;justify-content:space-between;font-size:7.5pt;margin-top:2px}
.itonote{font-size:7.5pt;margin-top:3px}
.itoser{border:1.2px solid #000;font-size:9pt;font-weight:bold;padding:4px 6px;margin-top:6px}
.itotab td{font-size:9pt}
.itodoc div{font-size:9pt;line-height:1.5}
.itolvl{border:1.2px solid #000;font-size:11pt;font-weight:bold;text-align:center;padding:5px;margin-top:11px}
.itofoot{font-size:7.5pt;line-height:1.4;border-top:1px solid #000;padding-top:5px;margin-top:9px}
</style>
</head>
<body>

<header>
  <div class="brand"><b>Karta drogowa</b><span style="color:var(--dim);font-size:11px">v31</span><small id="saveState">—</small></div>
  <div class="bar">
    <button class="btn primary" id="btnPrint">Печать / PDF</button>
    <select id="langSel" class="btn" style="width:auto;padding:9px 26px 9px 10px;font-size:14px" title="Język / Мова / Язык">
      <option value="ru">🇧🇾 Русский</option>
      <option value="ua">🇺🇦 Українська</option>
      <option value="pl">🇵🇱 Polski</option>
    </select>
    <select id="cardSel" style="width:auto;min-width:150px;padding:9px 30px 9px 10px;font-size:14px"></select>
    <button class="btn" id="btnNew">Новая карта</button>
    <button class="btn ghost" id="btnRename">Переименовать</button>
    <button class="btn ghost" id="btnEmpty">Пустые</button>
    <button class="btn" id="btnShare">Копия ⤴</button>
    <button class="btn ghost" id="btnExport">Экспорт</button>
    <button class="btn ghost" id="btnImport">Импорт</button>
    <button class="btn ghost danger" id="btnDel">Удалить</button>
  </div>
</header>

<div id="bkWarn" class="bkwarn" style="display:none"></div>
<nav id="tabs"></nav>
<main>
  <section class="pane" id="pane-main"></section>
  <section class="pane" id="pane-trasa"></section>
  <section class="pane" id="pane-tank"></section>
  <section class="pane" id="pane-koszty"></section>
  <section class="pane" id="pane-itogi"></section>
  <section class="pane" id="pane-info"></section>
</main>

<div id="print"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" style="display:none">

<script>
"use strict";

/* ================= Хранилище: работает и в приложении Claude, и в Safari ================= */
const Store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k,false); return r? r.value : null; } }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){}
    return (Store._m && Store._m[k]) || null;
  },
  async set(k,v){
    try{ if(window.storage){ await window.storage.set(k,v,false); return true; } }catch(e){}
    try{ localStorage.setItem(k,v); return true; }catch(e){}
    Store._m = Store._m || {}; Store._m[k]=v; return true;
  }
};
const KEY = "kd_v1";
const SNAP = "kd_snap_v1";   // копии внутри устройства
const LASTB = "kd_lastb_v1";  // когда последний раз выгружали файл

/* ================= Модель ================= */
const LIMITS = {trasa:30, tankON:17, tankAd:9, tankChl:3, zakupy:10, oplaty:10, serwisy:5, mandaty:3, wlasne:3};
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ============ Карты оплаты: топливные и банковские ============ */
const CARDS_PRESET = {
  fuel: ["E100","IDS","Shell","BP / Aral","Tankpool24","TFC","EW","DKV","UTA","Orlen Flota","Circle K","Moya","Gotówka"],
  bank: ["BNP Paribas","Erste","PKO BP","Santander","Pekao","ING","mBank","Millennium","Alior","Revolut","Gotówka"]
};
/* ============ Валюты ============ */
const CURR = ["EUR €","PLN zł","CHF","CZK Kč","DKK kr","NOK kr","SEK kr","HUF Ft","GBP £","RON lei"];
const CURR_BY_KRAJ = {
  PL:"PLN zł", CZ:"CZK Kč", CH:"CHF", DK:"DKK kr", NO:"NOK kr", SE:"SEK kr", HU:"HUF Ft",
  GB:"GBP £", UK:"GBP £", RO:"RON lei",
  DE:"EUR €", FR:"EUR €", IT:"EUR €", ES:"EUR €", NL:"EUR €", BE:"EUR €", AT:"EUR €",
  SK:"EUR €", SI:"EUR €", LT:"EUR €", LV:"EUR €", EE:"EUR €", FI:"EUR €", PT:"EUR €",
  IE:"EUR €", GR:"EUR €", HR:"EUR €", LU:"EUR €"
};
function curCode(v){ return String(v||"").split(" ")[0]; }
function litSum(v){
  const parts = String(v==null?"":v).split("+").map(x=>x.trim()).filter(x=>x!=="");
  const nums = parts.map(x=>parseFloat(x.replace(",","."))).filter(n=>!isNaN(n));
  const total = nums.reduce((a,b)=>a+b,0);
  return {n:nums.length, total: Math.round(total*1000)/1000, multi: parts.length>1};
}
function litTxt(v){ const t = litSum(v); return t.multi ? `${String(v).replace(/\s*\+\s*/g," + ")} = ${t.total}` : String(v==null?"":v).replace(/\+\s*$/,"").trim(); }
function litBadge(v){ const t = litSum(v); return t.multi ? `= ${t.total} · чеков: ${t.n}` : ""; }
function myCards(kind){ return (DB.mycards && DB.mycards[kind]) || []; }
function cardList(kind){
  const base = kind==="all" ? CARDS_PRESET.fuel.concat(CARDS_PRESET.bank)
                            : (CARDS_PRESET[kind]||[]);
  const mine = kind==="all" ? myCards("fuel").concat(myCards("bank")) : myCards(kind);
  const out = [];
  mine.concat(base).forEach(n=>{ if(n && out.indexOf(n)<0) out.push(n); });
  return out;
}
function addMyCard(kind, name){
  const k = kind==="all" ? "fuel" : kind;
  DB.mycards = DB.mycards || {fuel:[], bank:[]};
  DB.mycards[k] = DB.mycards[k] || [];
  if(DB.mycards[k].indexOf(name)<0) DB.mycards[k].push(name);
}

function newCard(name){
  return {

const IREV = (function(){ const m={}; for(const L of ["ua","pl"]){ const d=I18N[L]; for(const k in d){ m[nrm(d[k])] = k; } } return m; })();
function nrm(s){ return String(s).trim().replace(/\s+/g," "); }
function T(s, depth){
  if(s === null || s === undefined) return s;
  const raw = String(s), k = nrm(raw);
  if(!k) return raw;
  const ru = IREV[k] || k;
  const L = lang();
  if(L === "ru") return ru;
  const d = I18N[L] || {};
  if(d[ru] !== undefined) return d[ru];
  const pats = IPAT[L] || [];
  for(const pair of pats){
    const m = ru.match(pair[0]);
    if(m) return pair[1].replace(/\$(\d)/g, function(_, n){
      const g = m[+n] === undefined ? "" : m[+n];
      return (depth || 0) > 1 ? g : T(g, (depth || 0) + 1);
    });
  }
  return raw;
}
function translateTree(root){
  if(!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const arr = []; while(w.nextNode()) arr.push(w.currentNode);
  arr.forEach(function(n){
    const p = n.parentElement; if(!p) return;
    if(p.closest("#langSel,#cardSel,#print,#pane-itogi,select[data-card]")) return;
    const v = n.nodeValue; if(!/\S/.test(v)) return;
    const m = v.match(/^(\s*)([\s\S]*?)(\s*)$/);
    const t = T(m[2]);
    if(t !== m[2]) n.nodeValue = m[1] + t + m[3];
  });
  root.querySelectorAll("[placeholder]").forEach(function(el){
    const cur = el.getAttribute("placeholder"); const t = T(cur);
    if(t !== cur) el.setAttribute("placeholder", t);
  });
}
function applyLang(){
  const L = lang();
  document.documentElement.lang = L === "ua" ? "uk" : (L === "pl" ? "pl" : "ru");
  ["header","nav","main","#bkWarn"].forEach(function(sel){ translateTree(document.querySelector(sel)); });
  const s = document.getElementById("langSel"); if(s) s.value = L;
}

function gps(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error("Геолокация недоступна"));
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude, lon:p.coords.longitude}),
      e=>rej(e), {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
  });
}
/* кириллица -> латиница (резерв, если у города нет латинского имени) */
const TR={"а":"a","б":"b","в":"v","г":"h","ґ":"g","д":"d","е":"e","є":"ie","ж":"zh","з":"z","и":"y","і":"i","ї":"i","й":"i","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"shch","ъ":"","ы":"y","ь":"","э":"e","ю":"iu","я":"ia","ё":"e"};
function translit(s){
  return s.split("").map(ch=>{
    const low=ch.toLowerCase(), t=TR[low];
    if(t===undefined) return ch;
    return (ch===low) ? t : (t.charAt(0).toUpperCase()+t.slice(1));
  }).join("");
}

async function placeNow(){
  const {lat,lon} = await gps();
  let kraj = countryByCoords(lat,lon), city = "";
  try{
    const ctl = new AbortController(); const t=setTimeout(()=>ctl.abort(),4500);
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&namedetails=1&accept-language=en&lat=${lat}&lon=${lon}`,{signal:ctl.signal});
    clearTimeout(t);
    if(r.ok){ const j = await r.json(); const a=j.address||{}, n=j.namedetails||{};
      if(a.country_code) kraj = a.country_code.toUpperCase();
      /* 1) местное название (Warszawa, Munchen, Kosice) */
      let c = n.name || "";
      /* 2) если местное кириллицей (UA, BY, RS, BG, RU) — берём латиницу */
      if(!c || /[\u0400-\u04FF]/.test(c)) c = n["name:pl"] || n["name:en"] || n["name:de"] || c;
      /* 3) последний резерв — англ. поля адреса */
      if(!c) c = a.city||a.town||a.village||a.municipality||a.county||"";
      /* 4) если всё равно кириллица — транслит */
      city = /[\u0400-\u04FF]/.test(c) ? translit(c) : c;
    }
  }catch(e){ /* офлайн — остаётся определение по координатам */ }
  return {kraj, city, lat, lon};
}

function kwotaF(base,label){
  const v = getP(C, base+".kwota")||"";
  const c = getP(C, base+".cur")||"";
  const o = `<option value=""${c?"":" selected"}>—</option>` +
    CURR.map(n=>`<option value="${esc(n)}"${n===c?" selected":""}>${esc(n)}</option>`).join("");
  return `<label class="f"><span>${esc(label)}</span><div class="row2">
    <input data-p="${base}.kwota" value="${esc(v)}" inputmode="decimal">
    <select data-p="${base}.cur" class="cur">${o}</select></div></label>`;
}
function kwotaTxt(r){ const c = curCode(r.cur); return (r.kwota||"") + (r.kwota && c ? " "+c : ""); }
function cardF(path,label,kind){
  const v = getP(C,path)||"";
  const list = cardList(kind);
  let o = `<option value=""${v?"":" selected"}>—</option>`;
  if(v && list.indexOf(v)<0) o += `<option value="${esc(v)}" selected>${esc(v)}</option>`;
  o += list.map(n=>`<option value="${esc(n)}"${n===v?" selected":""}>${esc(n)}</option>`).join("");
  o += `<option value="__new">＋ Своя карта…</option>`;
  return `<label class="f"><span>${esc(label)}</span><select data-p="${path}" data-card="${kind}">${o}</select></label>`;
}

/* --------- Подпись пальцем --------- */
function initSigs(){
  document.querySelectorAll("canvas[data-sig]").forEach(cv=>{
    const path = cv.dataset.sig;
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const w = cv.clientWidth || 300, h = 140;
    cv.width = w*dpr; cv.height = h*dpr;
    const ctx = cv.getContext("2d");
    ctx.scale(dpr,dpr);
    ctx.lineWidth = 2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#0E1418";
    const saved = getP(C,path);
    if(saved){ const img = new Image(); img.onload = ()=> ctx.drawImage(img,0,0,w,h); img.src = saved; }
    let drawing=false, last=null;
    const pos = e =>{ const r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
    cv.addEventListener("pointerdown", e=>{
      e.preventDefault(); drawing=true; last=pos(e);
      try{ cv.setPointerCapture(e.pointerId); }catch(err){}
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(last.x+0.1,last.y); ctx.stroke();
    });
    cv.addEventListener("pointermove", e=>{
      if(!drawing) return; e.preventDefault();
      const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p;
    });
    const end = ()=>{ if(!drawing) return; drawing=false;
      setP(C, path, cv.toDataURL("image/png")); save(); };
    cv.addEventListener("pointerup", end);
    cv.addEventListener("pointercancel", end);
    cv.addEventListener("pointerleave", end);
  });
}

/* ============ подсветка заполненных строк ============ */
const ROW_RULES = {
  trasa:  r => { const zag = zList(r).every(x=> x.zk&&x.zm&&x.zd), wyl = wList(r).every(x=> x.wk&&x.wm&&x.wd);
    return {full: !!(zag&&wyl), label: zag&&wyl ? "готово" : (zag?"нет выгрузки":(wyl?"нет загрузки":"неполно"))}; },
  tankON: r => ({full: !!(r.d&&r.kraj&&r.litry), label:"готово"}),
  tankAd: r => ({full: !!(r.d&&r.kraj&&r.litry), label:"готово"}),
  tankChl:r => ({full: !!(r.d&&r.litry), label:"готово"}),
  _cost:  r => ({full: !!(r.co&&r.d&&r.kwota), label:"готово"})
};
function rowSummary(list, r){
  const S = '<span class="sep">|</span>';
  const g = (...a)=>a.filter(Boolean).map(esc).join(" ");
  if(list==="trasa"){
    const z = zList(r).map(x=>`Z: ${g(x.zk,x.zm,x.zd,x.zg)}`).join(S);
    const w = wList(r).map(x=>`W: ${g(x.wk,x.wm,x.wd,x.wg)}`).join(S);
    return `<b>${esc(r.nr)||"—"}</b>${S}${z}${S}${w}` + (r.waga?`${S}${esc(r.waga)}`:"");
  }
  if(list==="tankChl") return `${g(r.d,r.kraj)}${S}chłodnia ${esc(r.rej)||""}${S}<b>${esc(litTxt(r.litry))} L</b>`;
  if(list==="tankON"||list==="tankAd") return `${g(r.d,r.kraj)}${S}${esc(r.karta)||"—"}${S}<b>${esc(litTxt(r.litry))} L</b>` + (r.licznik?`${S}${esc(r.licznik)} km`:"");
  return `${g(r.d,r.kraj)}${S}${esc(r.co)||"—"}${S}<b>${esc(kwotaTxt(r))}</b>`;
}

function paintRow(el){
  const [list,i] = (el.dataset.row||"").split("|");
  const r = (C[list]||[])[+i]; if(!r) return;
  const any = Object.keys(r).some(k => { if(k[0]==="_") return false; const v=r[k];
    if(Array.isArray(v)) return v.length>0; return v!=="" && v!==false && v!=null; });
  const rule = ROW_RULES[list] || ROW_RULES._cost;
  const st = rule(r);
  el.classList.toggle("done", st.full);
  el.classList.toggle("todo", !st.full);
  const b = el.querySelector(".rst");
  if(b){
    b.className = "rst" + (st.full ? " done" : " todo");
    b.textContent = T(st.full ? "готово" : (any ? st.label : "пусто"));
  }
  const folded = r._f === true;
  el.classList.toggle("fold", folded);
  el.classList.remove("open");
  const fb = el.querySelector(".fbtn");
  if(fb) fb.textContent = T(folded ? "Править" : "Готово");
  const sm = el.querySelector(".rsum");
  if(sm && folded){ sm.innerHTML = rowSummary(list, r); translateTree(sm); }
}
function paintRows(){ document.querySelectorAll(".item[data-row]").forEach(paintRow); paintEmpty(); }

function ck(card, cur){
  const c = curCode(cur);
  return (String(card||"").trim() || "без карты") + (c ? " · " + c : "");
}
function sumByCard(rows){
  const m = {};
  rows.forEach(([name,val])=>{
    if(!String(name||"").trim() && !String(val||"").trim()) return;
    const k = (name||"").trim() || "без карты";
    const t = litSum(val);
    if(!m[k]) m[k] = {n:0, sum:0};
    m[k].n += Math.max(1, t.n); m[k].sum += t.total;
  });
  return Object.keys(m).sort().map(k=>[k, m[k]]);
}
function cardTotals(rows, unit, hint){
  const t = sumByCard(rows);
  if(!t.length) return "";
  const li = t.map(([k,v])=>`<div class="ctrow"><span>${esc(k)}</span><b>${(Math.round(v.sum*100)/100)} ${unit}</b><small>${v.n}</small></div>`).join("");
  const all = t.reduce((a,[,v])=>({sum:a.sum+v.sum, n:a.n+v.n}), {sum:0,n:0});
  const tot = (unit && t.length>1) ? `<div class="ctrow tot"><span>Всего</span><b>${(Math.round(all.sum*100)/100)} ${unit}</b><small>${all.n}</small></div>` : "";
  return `<div class="card"><h3>Итого по картам</h3>${li}${tot}<p class="hint">${esc(hint)}</p></div>`;
}
function renderMyCards(){
  const row = (kind,label)=>{
    const l = myCards(kind);
    const items = l.length ? l.map((n,i)=>`<span class="mycard">${esc(n)} <button class="mini" data-mycard-del="${kind}|${i}">✕</button></span>`).join("") : '<span class="hint">пока нет</span>';
    return `<p><b>${label}:</b> ${items} <button class="mini" data-mycard-add="${kind}">+ добавить</button></p>`;
  };
  return `<div class="card"><h3>Мои карты</h3>
    ${row("fuel","Топливные")}
    ${row("bank","Банковские")}
    <p class="hint">Пиши только название и, если нужно, 4 последние цифры — полный номер и PIN в приложение вносить не надо.</p></div>`;
}

/* ================= Итоги месяца =================
   Считается только из того, что уже вписано в карту.
   Норма порожнего пробега — Eurostat road_go_ta_tott, 2024:
   в международных перевозках ЕС порожними выполнено 12,6 % км.
   Окно 22:00–05:00 — запрет ночной езды в Швейцарии (art. 91 VRV).  */
const NORM_EMPTY = 12.6;
const FUEL_LO = 25, FUEL_HI = 33, FUEL_MIN = 18, FUEL_MAX = 40;
const NIGHT_FROM = 22, NIGHT_TO = 5;

let LG = null;                         /* временный язык для листа в офис */
function LX(ru, ua, pl){ const L = LG || lang(); return L === "pl" ? pl : (L === "ua" ? ua : ru); }
/* в графе Kraj часть кодов набрана кириллицей — «СН», «А» выглядят как латинские */
const CYR2LAT = {"А":"A","В":"B","С":"C","Е":"E","Н":"H","К":"K","М":"M","О":"O","Р":"P","Т":"T","У":"Y","Х":"X","І":"I","Ј":"J","Ѕ":"S","Д":"D","Ф":"F","Г":"G","Л":"L","И":"N","Б":"B"};
function krajCode(v){
  return String(v == null ? "" : v).trim().toUpperCase().split("").map(function(ch){ return CYR2LAT[ch] || ch; }).join("");
}
function nnum(v){
  const s = String(v == null ? "" : v).replace(/\s/g, "").replace(",", ".");
  if(!s || !/^-?\d+(\.\d+)?$/.test(s)) return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function dtOf(d, g){
  if(!d || !g) return null;
  const p = String(d).split("-").map(Number);
  const q = String(g).split(":").map(Number);
  if(p.length < 3 || !p[0] || isNaN(q[0])) return null;
  return new Date(p[0], p[1] - 1, p[2], q[0], q[1] || 0, 0, 0);
}
function dkey(dt){
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
}
function dshort(k){ const a = k.split("-"); return a[2] + "." + a[1]; }
function addNight(a, b, map){
  if(!a || !b || b <= a) return;
  const spanH = (b - a) / 3600000;
  const wins = [];
  let d = new Date(a.getFullYear(), a.getMonth(), a.getDate() - 1);
  const stop = new Date(b.getFullYear(), b.getMonth(), b.getDate() + 1);
  let guard = 0;
  while(d <= stop && guard++ < 120){
    wins.push([new Date(d.getFullYear(), d.getMonth(), d.getDate(), NIGHT_FROM, 0, 0, 0),
               new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, NIGHT_TO, 0, 0, 0)]);
    d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
  }
  const hit = [];
  wins.forEach(function(w){
    const s = Math.max(a.getTime(), w[0].getTime());
    const e = Math.min(b.getTime(), w[1].getTime());
    if(e > s) hit.push([w[0], (e - s) / 3600000]);
  });
  if(!hit.length) return;
  /* длинный перегон — внутри точно был отдых, считаем только первую и последнюю ночь */
  const use = (spanH > 36 && hit.length > 2) ? [hit[0], hit[hit.length - 1]] : hit;
  use.forEach(function(x){
    const k = dkey(x[0]);
    map[k] = Math.min(7, (map[k] || 0) + x[1]);
  });
}

function itogi(){
  const o = {km:0, loaded:0, empty:0, emptyPct:null, orders:0, pca:0, weight:0, weighed:0,
             countries:[], days:[], nightTotal:0, nightCount:0, nightFull:0, nightAvg:0,
             streak:0, streakFrom:"", streakTo:"",
             litres:0, segs:[], fuel:null, fuelSrc:"", spread:null,
             odo:null, from:"", to:"", flags:[]};
  const L = trasaLines();
  const kmP = nnum(C.stany.kmP), kmK = nnum(C.stany.kmK);

  /* --- километры, вес, страны, ночи --- */
  const cmap = {}, nmap = {}, seq = [];
  let prevW = null, dmin = null, dmax = null;
  L.forEach(function(r, i){
    const zl = nnum(r.zl), wl = nnum(r.wl);
    if(zl != null && wl != null && wl >= zl && wl - zl < 5000) o.loaded += wl - zl;
    if(prevW != null && zl != null && zl >= prevW && zl - prevW < 3000) o.empty += zl - prevW;
    if(zl != null) seq.push({v:zl, i:i + 1, what:"загрузка"});
    if(wl != null){ seq.push({v:wl, i:i + 1, what:"выгрузка"}); prevW = wl; }
    [r.zk, r.wk].forEach(function(k){
      const s = krajCode(k);
      if(s) cmap[s] = (cmap[s] || 0) + 1;
    });
    const w = nnum(r.waga);
    if(w != null){ o.weight += w; o.weighed++; }
    else if(String(r.waga || "").trim().toUpperCase() === "PCA") o.pca++;
    const a = dtOf(r.zd, r.zg), b = dtOf(r.wd, r.wg);
    if(a && b) addNight(a, b, nmap);
    [a, b].forEach(function(x){
      if(!x) return;
      if(!dmin || x < dmin) dmin = x;
      if(!dmax || x > dmax) dmax = x;
    });
  });
  o.orders = C.trasa.filter(function(r){
    return rowLines(r).some(function(x){ return x.nr || x.zm || x.wm || x.zl || x.wl; });
  }).length;
  o.loaded = Math.round(o.loaded);
  o.empty = Math.round(o.empty);
  o.km = (kmP != null && kmK != null && kmK > kmP) ? Math.round(kmK - kmP) : (o.loaded + o.empty);
  if(o.loaded + o.empty > 0) o.emptyPct = o.empty / (o.loaded + o.empty) * 100;
  o.countries = Object.keys(cmap).map(function(k){ return {k:k, n:cmap[k]}; })
                      .sort(function(a, b){ return b.n - a.n; });
  o.odo = kmK != null ? kmK : (seq.length ? Math.max.apply(null, seq.map(function(x){ return x.v; })) : null);

  /* --- ночи по дням --- */
  if(dmin && dmax){
    o.from = dkey(dmin); o.to = dkey(dmax);
    let d = new Date(dmin.getFullYear(), dmin.getMonth(), dmin.getDate()), guard = 0;
    while(d <= dmax && guard++ < 45){
      const k = dkey(d);
      o.days.push({k:k, h:Math.round((nmap[k] || 0) * 10) / 10});
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    }
  }
  let run = 0, from = "";
  o.days.forEach(function(x){
    o.nightTotal += x.h;
    if(x.h > 0){
      o.nightCount++;
      if(x.h >= 6.9) o.nightFull++;
      if(!run) from = x.k;
      run++;
      if(run > o.streak){ o.streak = run; o.streakFrom = from; o.streakTo = x.k; }
    } else run = 0;
  });
  o.nightTotal = Math.round(o.nightTotal);
  o.nightAvg = o.nightCount ? Math.round(o.nightTotal / o.nightCount * 10) / 10 : 0;

  /* --- топливо: только ON тягача --- */
  const TN = C.tankON.filter(function(r){ return r.d || r.litry || r.licznik; });
  TN.forEach(function(r){ o.litres += litSum(r.litry).total; });
  o.litres = Math.round(o.litres * 100) / 100;
  const full = TN.filter(function(r){ return String(r.pelna) === "tak" && nnum(r.licznik) != null; })
                 .sort(function(a, b){ return nnum(a.licznik) - nnum(b.licznik); });
  for(let i = 1; i < full.length; i++){
    const km = nnum(full[i].licznik) - nnum(full[i - 1].licznik);
    const lt = litSum(full[i].litry).total;
    if(km > 50 && lt > 0) o.segs.push({a:full[i - 1].d, b:full[i].d, km:km, lt:lt, l100:lt / km * 100});
  }
  const palP = nnum(C.stany.palP), palK = nnum(C.stany.palK);
  if(palP != null && palK != null && palP > 100 && o.litres > 0 && o.km > 0){
    o.fuel = (palP + o.litres - palK) / o.km * 100; o.fuelSrc = "бак";
  } else if(o.segs.length){
    const k = o.segs.reduce(function(a, s){ return a + s.km; }, 0);
    const l = o.segs.reduce(function(a, s){ return a + s.lt; }, 0);
    o.fuel = l / k * 100; o.fuelSrc = "отрезки";
  }
  if(o.segs.length > 1){
    const v = o.segs.map(function(s){ return s.l100; });
    o.spread = Math.max.apply(null, v) - Math.min.apply(null, v);
  }

  /* --- проверки --- */
  for(let i = 1; i < seq.length; i++){
    const step = seq[i].v - seq[i - 1].v;
    if(step < 0) o.flags.push({t:"bad", h:LX("Счётчик идёт назад: строка ", "Лічильник іде назад: рядок ", "Licznik cofa się: wiersz ") + seq[i].i,
                               d:seq[i - 1].v + " → " + seq[i].v});
    else if(step > 2500) o.flags.push({t:"bad", h:LX("Скачок счётчика: строка ", "Стрибок лічильника: рядок ", "Skok licznika: wiersz ") + seq[i].i,
                                       d:seq[i - 1].v + " → " + seq[i].v + " (+" + Math.round(step) + " " + LX("км","км","km") + ")"});
  }
  if(kmP != null && kmK != null && o.loaded + o.empty > 0){
    const diff = Math.abs((kmK - kmP) - (o.loaded + o.empty));
    if(diff > 60) o.flags.push({t:"bad", h:LX("Километры не сходятся","Кілометри не сходяться","Kilometry się nie zgadzają"),
                                d:LX("по строкам ","за рядками ","wg wierszy ") + (o.loaded + o.empty) + LX(" км, по счётчику "," км, за лічильником "," km, wg licznika ") + Math.round(kmK - kmP) + " " + LX("км","км","km")});
  }
  const nk = [];
  if(kmK == null) nk.push("Stan licznika KM");
  if(palK == null) nk.push("Stan Paliwa");
  if(nnum(C.stany.kompK) == null) nk.push("Zużycie z komputera");
  if(nnum(C.stany.adbK) == null) nk.push("Ad-Blue");
  if(nk.length) o.flags.push({t:"warn", h:LX("Не закрыты конечные показания","Не закриті кінцеві показання","Brak stanów końcowych"), d:nk.join(" · ")});
  TN.forEach(function(r, i){
    if(String(r.paragon) === "nie")
      o.flags.push({t:"warn", h:LX("Нет чека: заправка ","Немає чека: заправка ","Brak paragonu: tankowanie ") + (i + 1),
                    d:(fmtD(r.d, true) || "") + " · " + litSum(r.litry).total + " " + LX("л","л","l")});
  });
  const notFull = TN.filter(function(r){ return String(r.pelna) === "nie"; }).length;
  if(notFull && o.fuelSrc === "отрезки")
    o.flags.push({t:"warn", h:LX("Не все заправки do pełna","Не всі заправки do pełna","Nie wszystkie tankowania do pełna"), d:LX("расход по отрезкам считается приблизительно","витрата по відрізках рахується приблизно","spalanie na odcinkach liczone przybliżenie")});
  return o;
}

function loadLevel(o){
  const s = [o.km > 11500 ? 2 : (o.km >= 8500 ? 1 : 0),
             o.nightTotal > 75 ? 2 : (o.nightTotal >= 40 ? 1 : 0),
             o.orders > 22 ? 2 : (o.orders >= 15 ? 1 : 0)];
  const n = s[0] + s[1] + s[2];
  return n >= 5 ? "Тяжёлый" : (n >= 2 ? "Обычный" : "Лёгкий");
}

/* --- графика: SVG, чтобы печаталась и без фоновой заливки --- */
function nightSvg(o){
  const d = o.days.length ? o.days : [{k:"", h:0}];
  const W = 320, H = 62, gap = d.length > 1 ? 1.4 : 0;
  const bw = (W - gap * (d.length - 1)) / d.length;
  let s = "";
  d.forEach(function(x, i){
    const hh = x.h <= 0 ? 1.6 : Math.max(2.5, x.h / 7 * H);
    const cls = x.h <= 0 ? "nb-zero" : (x.h >= 6.9 ? "nb-full" : "nb-part");
    s += '<rect class="' + cls + '" x="' + (i * (bw + gap)).toFixed(2) + '" y="' + (H - hh).toFixed(2) +
         '" width="' + bw.toFixed(2) + '" height="' + hh.toFixed(2) + '"/>';
  });
  return '<svg class="chart nchart" viewBox="0 0 ' + W + ' ' + (H + 1) + '" preserveAspectRatio="none" role="img">' +
         s + '<rect class="ax" x="0" y="' + H + '" width="' + W + '" height="0.7"/></svg>';
}
function scaleSvg(val, lo, hi, mark, band){
  const W = 320, H = 17;
  const px = function(v){ return Math.max(0, Math.min(1, (v - lo) / (hi - lo))) * W; };
  let s = '<rect class="sc-bg" x="0" y="0" width="' + W + '" height="' + H + '"/>';
  if(band) s += '<rect class="sc-band" x="' + px(band[0]).toFixed(1) + '" y="0" width="' +
                (px(band[1]) - px(band[0])).toFixed(1) + '" height="' + H + '"/>';
  if(val != null) s += '<rect class="sc-fill" x="' + (px(val) - 1.4).toFixed(1) + '" y="-2" width="2.8" height="' + (H + 4) + '"/>';
  if(mark != null) s += '<rect class="sc-mark" x="' + (px(mark) - 0.9).toFixed(1) + '" y="-3" width="1.8" height="' + (H + 6) + '"/>';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img">' + s + '</svg>';
}
function barSvg(val, max){
  const W = 320, H = 15;
  const w = Math.max(1, Math.min(1, val / max) * W);
  return '<svg class="chart bchart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img">' +
         '<rect class="sc-bg" x="0" y="0" width="' + W + '" height="' + H + '"/>' +
         '<rect class="bar-a" x="0" y="0" width="' + w.toFixed(1) + '" height="' + H + '"/></svg>';
}

/* ================= ПЕЧАТЬ: точная копия бланка ================= */
/* Одна загрузка может иметь несколько выгрузок — на бланке каждая занимает свою строку */
function wyls(r){ return Array.isArray(r.w2) ? r.w2 : []; }
function zals(r){ return Array.isArray(r.z2) ? r.z2 : []; }
/* Под одним nr zlecenia может быть несколько загрузок и несколько выгрузок.
   На бланке они идут параллельно: своя графа слева, своя справа. */
function zList(r){ return [{zk:r.zk,zm:r.zm,zd:r.zd,zg:r.zg,zl:r.zl}].concat(zals(r)); }
function wList(r){ return [{wk:r.wk,wm:r.wm,wd:r.wd,wg:r.wg,wl:r.wl,waga:r.waga}].concat(wyls(r)); }
function rowLines(r){
  const Z = zList(r), W = wList(r), n = Math.max(Z.length, W.length), out = [];
  for(let k=0;k<n;k++){
    const z = Z[k]||{}, w = W[k]||{};
    out.push({nr: k===0 ? r.nr : "",
      zk:z.zk||"", zm:z.zm||"", zd:z.zd||"", zg:z.zg||"", zl:z.zl||"",
      wk:w.wk||"", wm:w.wm||"", wd:w.wd||"", wg:w.wg||"", wl:w.wl||"", waga:w.waga||""});
  }
  return out;
}
function trasaLines(){ const out=[]; C.trasa.forEach(r=> rowLines(r).forEach(x=>out.push(x))); return out; }
function trasaCount(){ return C.trasa.reduce((n,r)=> n + Math.max(zList(r).length, wList(r).length), 0); }

function pad(list,n,mk){ const a = list.slice(0,n).map(x=>x); while(a.length<n) a.push(mk()); return a; }
const D = "……………";

/* Длинное значение (город и т.п.) не переносим, а слегка ужимаем по ширине графы.
   cap — сколько знаков помещается в графу при обычном 8.5pt. */
function fitv(v, cap, cls){
  const t = String(v == null ? "" : v).trim();
  const c = "val fitv" + (cls ? " " + cls : "");
  return `<span class="${c}">${esc(t)}</span>`;
}

/* Замер по факту: если значение не влезло в графу — уменьшаем шрифт, пока не влезет. */
function fitCells(){
  document.querySelectorAll("#print .fitv").forEach(el=>{
    el.style.fontSize = "";
    const td = el.parentElement; if(!td) return;
    const avail = td.clientWidth - 4;
    if(avail <= 0 || !el.textContent.trim()) return;
    let sz = parseFloat(getComputedStyle(el).fontSize) || 11.3;
    let w = el.scrollWidth, guard = 0;
    while(w > avail && sz > 5 && guard++ < 25){
      sz = Math.max(5, sz * Math.min(0.94, avail / w));
      el.style.fontSize = sz + "px";
      w = el.scrollWidth;
    }
  });
}

/* Каждый лист ужимается ровно под один A4, чтобы всегда было 4 страницы */
const BOX_W = 680, BOX_H = 880;
function fitPages(){
  document.querySelectorAll("#print .sheet").forEach(sh=>{
    sh.style.zoom = 1;
    sh.style.width = BOX_W + "px";
    sh.style.minHeight = BOX_H + "px";
    const H = sh.scrollHeight;
    let s = H > 0 ? Math.min(1, BOX_H / H) : 1;
    if(s < 1){
      s = s * 0.98;
      sh.style.width = (BOX_W / s) + "px";
      sh.style.minHeight = (BOX_H / s) + "px";
      sh.style.zoom = s;
    }
  });
}

/* ================= Резервные копии ================= */
const DAY = 86400000;

// Снимок всех карт внутри устройства (хранится 3 последних)
async function snapshot(){
  try{
    let box = {items:[]};
    const raw = await Store.get(SNAP);
    if(raw){ try{ box = JSON.parse(raw); }catch(e){} }
    const now = Date.now();
    const last = box.items[0];
    if(last && (now - last.t) < 6*3600000) box.items.shift(); // не чаще раза в 6 часов
    box.items.unshift({t: now, data: JSON.stringify(DB)});
    box.items = box.items.slice(0,3);
    await Store.set(SNAP, JSON.stringify(box));
  }catch(e){}
}

function backupBlob(){
  return new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
}
function backupName(){ return "karta-" + todayISO() + ".json"; }

async function saveBackupFile(silent){
  try{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(backupBlob());
    a.download = backupName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    await Store.set(LASTB, String(Date.now()));
    if(!silent) toast("Копия сохранена в Загрузки");
    renderWarn();
    return true;
  }catch(e){ return false; }
}

// Отправить копию в облако/мессенджер одним тапом
async function shareBackup(){
  const file = new File([backupBlob()], backupName(), {type:"application/json"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Karta drogowa — копия"});
      await Store.set(LASTB, String(Date.now()));
      renderWarn();
      return;
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  saveBackupFile();
}

let lastBackupTs = 0;
async function loadBackupState(){
  const v = await Store.get(LASTB);
  lastBackupTs = v ? Number(v) : 0;
}
function daysSinceBackup(){
  if(!lastBackupTs) return 999;
  return Math.floor((Date.now() - lastBackupTs) / DAY);
}
function hasData(){
  return DB.cards.some(c => c.trasa.length || c.tankON.length || c.head.nrWyjazdu || c.baza.wyjD);
}
function renderWarn(){
  const el = $("#bkWarn");
  if(!el) return;
  const d = daysSinceBackup();
  if(!hasData() || d < 3){ el.style.display = "none"; return; }
  el.style.display = "flex";
  el.innerHTML = `<div>Копии карты нет ${d>90?"ни разу":"уже "+d+" дн."}. Если планшет пропадёт — данные пропадут вместе с ним.</div>
    <button id="warnBk">Сделать</button>`;
}

// Раз в сутки сама выгружает файл в Загрузки
async function maybeAutoBackup(){
  await loadBackupState();
  renderWarn();
  if(!hasData()) return;
  if(Date.now() - lastBackupTs > DAY){
    const ok = await saveBackupFile(true);
    if(ok){ lastBackupTs = Date.now(); toast("Копия сохранена в Загрузки"); }
  }
}

document.addEventListener("click", async e=>{
  const t = e.target.closest("button, .tab"); if(!t) return;

  if(t.dataset.tab){ activeTab = t.dataset.tab; renderTabs();
    if(activeTab==="main") initSigs();
    window.scrollTo({top:0}); return; }

  if(t.dataset.pca){
    const p = t.dataset.pca;
    const on = (getP(C,p)||"").trim().toUpperCase() === "PCA";
    setP(C, p, on ? "" : "PCA");
    const box = t.closest(".row2");
    if(box) box.querySelectorAll("input").forEach(i=>{ const q=i.dataset.p; if(q) i.value = getP(C,q)||""; });
    t.classList.toggle("on", !on);
    save(); paintEmpty();
    const row = t.closest(".item[data-row]"); if(row) paintRow(row);
    return;
  }

  if(t.dataset.now){
    const [kind,p1,p2] = t.dataset.now.split("|");
    if(kind==="d") setP(C,p1,todayISO());
    if(kind==="t") setP(C,p1,nowHM());
    if(kind==="dt"){ setP(C,p1,todayISO()); setP(C,p2,nowHM()); }
    const box = t.closest("label") || t.closest(".row2");
    box.querySelectorAll("input").forEach(i=>{ const p=i.dataset.p; if(p) i.value = getP(C,p)||""; });
    save(); paintEmpty(); toast("Дата и время подставлены"); return;
  }

  if(t.dataset.gps){
    const [pk,pm] = t.dataset.gps.split("|");
    const old = t.textContent; t.textContent="…"; t.disabled=true;
    try{
      const r = await placeNow();
      if(pk) setP(C,pk,r.kraj);
      if(pk && pk.endsWith(".kraj")){
        const cp = pk.slice(0,-5) + ".cur";
        const guess = CURR_BY_KRAJ[String(r.kraj||"").toUpperCase()];
        if(guess && !getP(C,cp)){
          setP(C,cp,guess);
          const sel = document.querySelector(`select[data-p="${cp}"]`);
          if(sel){ sel.value = guess; markEmpty(sel); }
        }
      }
      if(pm && r.city) setP(C,pm,r.city);
      const box = t.closest("label")||t.closest(".row2");
      box.querySelectorAll("input").forEach(i=>{ const p=i.dataset.p; if(p) i.value = getP(C,p)||""; });
      save(); paintEmpty();
      toast(r.city ? `${r.kraj}, ${r.city}` : (r.kraj? `Страна: ${r.kraj}` : "Страна не определена"));
    }catch(err){
      toast("Нет доступа к геолокации");
    }
    t.textContent=old; t.disabled=false; return;
  }

  if(t.dataset.plus){
    const path = t.dataset.plus;
    const cur = String(getP(C,path)||"").trim();
    if(!cur){ toast("Сначала впиши литры первого чека"); return; }
    if(cur.endsWith("+")) return;
    setP(C, path, cur + "+"); save();
    const box = t.closest(".row2");
    const inpEl = box.querySelector("input[data-p]");
    inpEl.value = getP(C,path); inpEl.focus();
    const b = t.closest("label").querySelector(".sumbadge"); if(b) b.textContent = litBadge(inpEl.value);
    return;
  }

  if(t.dataset.mycardAdd){
    const kind = t.dataset.mycardAdd;
    const name = (prompt(T("Название карты (можно с 4 последними цифрами):"))||"").trim();
    if(!name) return;
    addMyCard(kind, name); save(true); renderKoszty(); paintRows(); toast("Добавлено"); return;
  }
  if(t.dataset.mycardDel){
    const [kind,i] = t.dataset.mycardDel.split("|");
    const l = myCards(kind); const nm = l[+i];
    if(!confirm(T(`Убрать «${nm}» из списка? В уже заполненных строках она останется.`))) return;
    DB.mycards[kind].splice(+i,1); save(true); renderKoszty(); paintRows(); return;
  }

  if(t.id === "warnBk" || t.id === "btnShare2"){ shareBackup(); return; }
  if(t.dataset.snap !== undefined){ restoreSnap(+t.dataset.snap); return; }

  if(t.dataset.sigclear){
    setP(C, t.dataset.sigclear, ""); save(); renderMain(); toast("Подпись очищена"); return;
  }

  if(t.dataset.addz){
    const i = +t.dataset.addz, r = C.trasa[i]; if(!r) return;
    if(trasaCount() >= LIMITS.trasa){ toast(`На бланке ${LIMITS.trasa} строк — больше не влезет`); return; }
    if(!Array.isArray(r.z2)) r.z2 = [];
    r.z2.push(blank.zal()); save(); renderTrasa(); paintRows();
    return;
  }

  if(t.dataset.delz){
    const [i,j] = t.dataset.delz.split("|").map(Number);
    const r = C.trasa[i]; if(!r || !Array.isArray(r.z2)) return;
    if(!confirm(T("Удалить запись?"))) return;
    r.z2.splice(j,1); if(!r.z2.length) delete r.z2;
    save(); renderTrasa(); paintRows();
    return;
  }

  if(t.dataset.addw){
    const i = +t.dataset.addw, r = C.trasa[i]; if(!r) return;
    if(trasaCount() >= LIMITS.trasa){ toast(`На бланке ${LIMITS.trasa} строк — больше не влезет`); return; }
    if(!Array.isArray(r.w2)) r.w2 = [];
    r.w2.push(blank.wyl()); save(); renderTrasa(); paintRows();
    return;
  }

  if(t.dataset.delw){
    const [i,j] = t.dataset.delw.split("|").map(Number);
    const r = C.trasa[i]; if(!r || !Array.isArray(r.w2)) return;
    if(!confirm(T("Удалить запись?"))) return;
    r.w2.splice(j,1); if(!r.w2.length) delete r.w2;
    save(); renderTrasa(); paintRows();
    return;
  }

  if(t.dataset.add){
    const list = t.dataset.add;
    if(list==="trasa" && trasaCount() >= LIMITS.trasa){ toast(`На бланке ${LIMITS.trasa} строк — больше не влезет`); return; }
    if(C[list].length >= LIMITS[list]){ toast(`На бланке ${LIMITS[list]} строк — больше не влезет`); return; }
    const mk = list==="trasa"?blank.trasa : (list==="tankON"||list==="tankAd")?blank.tank :
               list==="tankChl"?blank.tankChl : list==="zakupy"?blank.zakupy :
               list==="wlasne"?blank.wlasne : blank.oplaty;
    C[list].push(mk()); save();
    if(list==="trasa") renderTrasa(); else if(list.startsWith("tank")) renderTank(); else renderKoszty();
    paintRows();
    return;
  }

  if(t.dataset.fold){
    const [list,i] = t.dataset.fold.split("|");
    const r = (C[list]||[])[+i]; if(!r) return;
    const row = t.closest(".item[data-row]");
    if(r._f === true) delete r._f; else r._f = true;
    save(true); if(row){ paintRow(row); row.scrollIntoView({block:"nearest"}); }
    return;
  }

  if(t.dataset.del){
    const [list,i] = t.dataset.del.split("|");
    if(!confirm(T("Удалить запись?"))) return;
    C[list].splice(+i,1); save();
    if(list==="trasa") renderTrasa(); else if(list.startsWith("tank")) renderTank(); else renderKoszty();
    paintRows();
    return;
  }

  switch(t.id){
    case "btnPrint": buildPrint(); setTimeout(()=>window.print(),120); break;
    case "btnItogiPrint": if(buildItogiPrint()) setTimeout(()=>window.print(),120); break;
    case "btnNew": { const n = prompt(T("Название новой карты:"), "Karta " + new Date().toLocaleDateString("ru-RU"));
      if(n===null) return; const c = newCard(n.trim()); DB.cards.push(c); DB.active=c.id; C=c; save(true); renderAll(); toast("Карта создана"); break; }
    case "btnRename": { const n = prompt(T("Название карты:"), C.name); if(n===null) return; C.name=n.trim()||C.name; save(true); renderCards(); break; }
    case "btnDel": { if(DB.cards.length<2){ toast("Это единственная карта"); return; }
      if(!confirm(T(`Удалить «${C.name}»? Данные пропадут.`))) return;
      DB.cards = DB.cards.filter(c=>c.id!==C.id); C = DB.cards[0]; DB.active=C.id; save(true); renderAll(); break; }
    case "btnEmpty": DB.hlEmpty = (DB.hlEmpty === false); save(true); applyHl();
      toast(DB.hlEmpty === false ? "Подсветка выключена" : "Пустые графы подсвечены"); break;
    case "btnExport": saveBackupFile(); break;
    case "btnShare": shareBackup(); break;
    case "btnImport": $("#fileIn").click(); break;
  }
});

  r.readAsText(f); e.target.value="";
});

/* ================= Старт ================= */
(async function init(){
  const raw = await Store.get(KEY);
  if(raw){ try{ DB = JSON.parse(raw); }catch(e){ DB={cards:[],active:""}; } }
  if(!DB.mycards) DB.mycards = {fuel:[], bank:[]};
  if(!DB.mycards.fuel) DB.mycards.fuel = [];
  if(!DB.mycards.bank) DB.mycards.bank = [];
  if(!DB.cards || !DB.cards.length){ const c=newCard(); DB={cards:[c], active:c.id}; }
  C = DB.cards.find(c=>c.id===DB.active) || DB.cards[0];
  DB.active = C.id;
  // добить недостающие поля после обновлений
  const base = newCard(); for(const k in base){ if(C[k]===undefined) C[k]=base[k]; }
  renderAll();
  $("#saveState").textContent = T("готово");
  maybeAutoBackup();
})();
</script>
</body>
</html>
