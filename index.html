document.addEventListener("click", async e=>{
  const t = e.target.closest("button, .tab"); if(!t) return;
  /* нажал что-то другое — взведённая кнопка удаления снимается */
  if(!t.dataset.del) document.querySelectorAll('[data-del][data-armed="1"]').forEach(function(b){
    b.dataset.armed = "0"; b.classList.remove("arm"); b.textContent = T("Удалить");
  });

  if(t.dataset.tab){ activeTab = t.dataset.tab; renderTabs();
    if(activeTab==="main") initSigs();
    window.scrollTo({top:0}); return; }

  if(t.dataset.pca){
    const p = t.dataset.pca;
    const on = (getP(C,p)||"").trim().toUpperCase() === "PCA";
    setP(C, p, on ? "" : "PCA");
    const box = t.closest(".row2");
    if(box) box.querySelectorAll("input").forEach(i=>{ const q=i.dataset.p; if(q) i.value = getP(C,q)||""; });
    t.classList.toggle("on", !on);
    save(); paintEmpty();
    const row = t.closest(".item[data-row]"); if(row) paintRow(row);
    return;
  }

  if(t.dataset.now){
    const [kind,p1,p2] = t.dataset.now.split("|");
    if(kind==="d") setP(C,p1,todayISO());
    if(kind==="t") setP(C,p1,nowHM());
    if(kind==="dt"){ setP(C,p1,todayISO()); setP(C,p2,nowHM()); }
    const box = t.closest("label") || t.closest(".row2");
    box.querySelectorAll("input").forEach(i=>{ const p=i.dataset.p; if(p) i.value = getP(C,p)||""; });
    save(); paintEmpty(); toast("Дата и время подставлены"); return;
  }

  if(t.dataset.gps){
    const [pk,pm] = t.dataset.gps.split("|");
    const old = t.textContent; t.textContent="…"; t.disabled=true;
    try{
      const r = await placeNow();
      if(pk) setP(C,pk,r.kraj);
      if(pk && pk.endsWith(".kraj")){
        const cp = pk.slice(0,-5) + ".cur";
        const guess = CURR_BY_KRAJ[String(r.kraj||"").toUpperCase()];
        if(guess && !getP(C,cp)){
          setP(C,cp,guess);
          const sel = document.querySelector(`select[data-p="${cp}"]`);
          if(sel){ sel.value = guess; markEmpty(sel); }
        }
      }
      if(pm && r.city) setP(C,pm,r.city);
      const box = t.closest("label")||t.closest(".row2");
      box.querySelectorAll("input").forEach(i=>{ const p=i.dataset.p; if(p) i.value = getP(C,p)||""; });
      save(); paintEmpty();
      toast(r.city ? `${r.kraj}, ${r.city}` : (r.kraj? `Страна: ${r.kraj}` : "Страна не определена"));
    }catch(err){
      toast("Нет доступа к геолокации");
    }
    t.textContent=old; t.disabled=false; return;
  }

  if(t.dataset.plus){
    const path = t.dataset.plus;
    const cur = String(getP(C,path)||"").trim();
    if(!cur){ toast("Сначала впиши литры первого чека"); return; }
    if(cur.endsWith("+")) return;
    setP(C, path, cur + "+"); save();
    const box = t.closest(".row2");
    const inpEl = box.querySelector("input[data-p]");
    inpEl.value = getP(C,path); inpEl.focus();
    const b = t.closest("label").querySelector(".sumbadge"); if(b) b.textContent = litBadge(inpEl.value);
    return;
  }

  if(t.dataset.mycardAdd){
    const kind = t.dataset.mycardAdd;
    const name = (prompt(T("Название карты (можно с 4 последними цифрами):"))||"").trim();
    if(!name) return;
    addMyCard(kind, name); save(true); renderKoszty(); paintRows(); toast("Добавлено"); return;
  }
  if(t.dataset.mycardDel){
    const [kind,i] = t.dataset.mycardDel.split("|");
    const l = myCards(kind); const nm = l[+i];
    if(!confirm(T(`Убрать «${nm}» из списка? В уже заполненных строках она останется.`))) return;
    DB.mycards[kind].splice(+i,1); save(true); renderKoszty(); paintRows(); return;
  }

  if(t.id === "warnBk" || t.id === "btnShare2"){ shareBackup(); return; }
  if(t.dataset.snap !== undefined){ restoreSnap(+t.dataset.snap); return; }

  if(t.dataset.sigclear){
    setP(C, t.dataset.sigclear, ""); rememberSig(); save(); renderMain(); toast("Подпись очищена"); return;
  }
  if(t.dataset.sigpick){ SIGPICK = (SIGPICK === t.dataset.sigpick ? "" : t.dataset.sigpick); renderMain(); return; }
  if(t.dataset.sigset){
    const a = t.dataset.sigset.split("|"), x = sigChoices()[+a[1]]; if(!x) return;
    setP(C, a[0], x.v); SIGPICK = ""; rememberSig(); save(true); renderMain(); toast("Подпись перенесена"); return;
  }
  if(t.dataset.sigswap){
    const k = C.sig.k1; C.sig.k1 = C.sig.k2; C.sig.k2 = k; SIGPICK = ""; rememberSig(); save(true); renderMain(); toast("Подписи поменяны местами"); return;
  }
  if(t.dataset.sigcopy){
    const which = t.dataset.sigcopy.split(".")[1];
    const img = prevSig(which);
    if(!img){ toast("Нечего переносить"); return; }
    setP(C, t.dataset.sigcopy, img); rememberSig(); save(true); renderMain(); toast("Подпись перенесена"); return;
  }

  if(t.dataset.addz){
    const i = +t.dataset.addz, r = C.trasa[i]; if(!r) return;
    if(trasaCount() >= LIMITS.trasa){ toast(`На бланке ${LIMITS.trasa} строк — больше не влезет`); return; }
    if(!Array.isArray(r.z2)) r.z2 = [];
    r.z2.push(blank.zal()); save(); renderTrasa(); paintRows();
    return;
  }

  if(t.dataset.delz){
    const [i,j] = t.dataset.delz.split("|").map(Number);
    const r = C.trasa[i]; if(!r || !Array.isArray(r.z2)) return;
    if(!confirm(T("Удалить запись?"))) return;
    r.z2.splice(j,1); if(!r.z2.length) delete r.z2;
    save(); renderTrasa(); paintRows();
    return;
  }

  if(t.dataset.addw){
    const i = +t.dataset.addw, r = C.trasa[i]; if(!r) return;
    if(trasaCount() >= LIMITS.trasa){ toast(`На бланке ${LIMITS.trasa} строк — больше не влезет`); return; }
    if(!Array.isArray(r.w2)) r.w2 = [];
    r.w2.push(blank.wyl()); save(); renderTrasa(); paintRows();
    return;
  }

  if(t.dataset.delw){
    const [i,j] = t.dataset.delw.split("|").map(Number);
    const r = C.trasa[i]; if(!r || !Array.isArray(r.w2)) return;
    if(!confirm(T("Удалить запись?"))) return;
    r.w2.splice(j,1); if(!r.w2.length) delete r.w2;
    save(); renderTrasa(); paintRows();
    return;
  }

  if(t.dataset.add){
    const list = t.dataset.add;
    if(list==="trasa" && trasaCount() >= LIMITS.trasa){ toast(`На бланке ${LIMITS.trasa} строк — больше не влезет`); return; }
    if(C[list].length >= LIMITS[list]){ toast(`На бланке ${LIMITS[list]} строк — больше не влезет`); return; }
    const mk = list==="trasa"?blank.trasa : (list==="tankON"||list==="tankAd")?blank.tank :
               list==="tankChl"?blank.tankChl : list==="zakupy"?blank.zakupy :
               list==="wlasne"?blank.wlasne : blank.oplaty;
    C[list].push(mk()); save();
    if(list==="trasa") renderTrasa(); else if(list.startsWith("tank")) renderTank(); else renderKoszty();
    paintRows();
    return;
  }

  if(t.dataset.fold){
    const [list,i] = t.dataset.fold.split("|");
    const r = (C[list]||[])[+i]; if(!r) return;
    const row = t.closest(".item[data-row]");
    if(r._f === true) delete r._f; else r._f = true;
    save(true); if(row){ paintRow(row); row.scrollIntoView({block:"nearest"}); }
    return;
  }

  if(t.id === "undoBtn"){
    if(UNDO){ C[UNDO.list].splice(UNDO.i, 0, UNDO.row); save(true); renderList(UNDO.list); paintRows(); }
    UNDO = null; hideToast(); toast("Строка возвращена"); return;
  }
  if(t.dataset.del){
    const [list,i] = t.dataset.del.split("|");
    /* первое нажатие только взводит кнопку, удаляет второе — и то 4 секунды */
    if(t.dataset.armed !== "1"){
      document.querySelectorAll('[data-del]').forEach(function(b){
        b.dataset.armed = "0"; b.classList.remove("arm"); b.textContent = T("Удалить");
      });
      t.dataset.armed = "1"; t.classList.add("arm"); t.textContent = T("Точно удалить?");
      clearTimeout(ARMT);
      ARMT = setTimeout(function(){
        if(!t.isConnected) return;
        t.dataset.armed = "0"; t.classList.remove("arm"); t.textContent = T("Удалить");
      }, 4000);
      return;
    }
    clearTimeout(ARMT);
    UNDO = {list:list, i:+i, row:C[list][+i]};
    C[list].splice(+i,1); save(true);
    renderList(list); paintRows();
    toastUndo("Строка удалена");
    return;
  }

  switch(t.id){
    /* iOS 27: window.print() в веб-приложении больше не открывается. Поэтому
       «Печать / PDF» теперь сама собирает настоящий PDF и отдаёт его через
       «Поделиться» (там есть Печать и Сохранить в Файлы). */
    case "btnPrint": PRINT_MODE = "card"; buildPrint(); exportPdf(); break;
    case "btnPrintNative": PRINT_MODE = "card"; buildPrint(); safePrint(); break;
    case "btnCabPrint": PRINT_MODE = "itogi";
      if(buildCabPrint()) exportPdf("Kabotaz"); else PRINT_MODE = "card";
      break;
    case "btnItogiPrint": PRINT_MODE = "itogi";
      if(buildItogiPrint()) exportPdf(); else PRINT_MODE = "card";
      break;
    case "btnNew": { const n = prompt(T("Название новой карты:"), "Karta " + new Date().toLocaleDateString("ru-RU"));
      if(n===null) return;
      const sg = lastSig();
      const c = newCard(n.trim(), sg);
      DB.cards.push(c); DB.active=c.id; C=c; save(true); renderAll();
      toast(sg ? "Карта создана, подпись перенесена" : "Карта создана"); break; }
    case "btnClose": closeCardDlg(); break;
    case "btnRename": { const n = prompt(T("Название карты:"), C.name); if(n===null) return; C.name=n.trim()||C.name; save(true); renderCards(); break; }
    case "btnDel": { if(DB.cards.length<2){ toast("Это единственная карта"); return; }
      if(!confirm(T(`Удалить «${C.name}»? Данные пропадут.`))) return;
      DB.cards = DB.cards.filter(c=>c.id!==C.id); C = DB.cards[0]; DB.active=C.id; save(true); renderAll(); break; }
    case "btnGfx": { const on = !(gfxOn("fl") || gfxOn("co")); DB.gfx = {fl:on, co:on}; save(true); gfxBtn();
      toast(on ? "Флаги и логотип на бланке включены" : "Бланк печатается без графики"); break; }
    case "btnEmpty": DB.hlEmpty = (DB.hlEmpty === false); save(true); applyHl();
      toast(DB.hlEmpty === false ? "Подсветка выключена" : "Пустые графы подсвечены"); break;
    case "btnExport": saveBackupFile(); break;
    case "btnShare": shareBackup(); break;
    case "btnImport": $("#fileIn").click(); break;
  }
});

});

$("#cardSel").addEventListener("change", e=>{
  const c = DB.cards.find(x=>x.id===e.target.value); if(!c) return;

});

$("#fileIn").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{
      const data = JSON.parse(r.result);
      if(Array.isArray(data.sigLib)){ DB.sigLib = DB.sigLib||[]; data.sigLib.forEach(e=>{ if(e && e.v && !DB.sigLib.some(x=>x.v===e.v)) DB.sigLib.push(e); }); }
      if(Array.isArray(data.veh)){ DB.veh = DB.veh||[]; data.veh.forEach(x=>{ if(x && !DB.veh.some(y=>plKey(y)===plKey(x))) DB.veh.push(x); }); }
      if(data.mycards){ ["fuel","bank"].forEach(k=> (data.mycards[k]||[]).forEach(n=> addMyCard(k,n))); }
      const list = Array.isArray(data.cards) ? data.cards : [data];
      let added = 0;
      list.forEach(c=>{
        const base = newCard();
        const card = Object.assign(base, c, {id: uid()});
        card.name = (c.name || "Импорт");
        DB.cards.push(card); added++;
      });
      if(added){
        C = DB.cards[DB.cards.length-1]; DB.active = C.id;
        save(true); renderAll(); toast(added>1 ? `Загружено карт: ${added}` : "Карта загружена");
      }
    }catch(err){ toast("Файл не читается"); } };
  r.readAsText(f); e.target.value="";
});

/* ---------- PDF без библиотек ----------
   Каждый лист (#print .page) рисуется в картинку через SVG foreignObject,
   картинки упаковываются в PDF (A4, поля 12 мм) — как и при обычной печати. */
function pageToJpeg(pageEl, scale){
  return new Promise((resolve, reject)=>{
    const css = Array.from(document.querySelectorAll("style")).map(x=>x.textContent).join("\n");
    const wrap = document.createElement("div");
    wrap.setAttribute("xmlns","http://www.w3.org/1999/xhtml");
    const st = document.createElement("style");
    st.textContent = css + "\n#print{position:static!important;left:auto!important;width:" + BOX_W + "px}" +
                     ".page{margin:0!important}";
    const box = document.createElement("div");
    box.id = "print";
    // Подписи в foreignObject WebKit рисует пустыми с первого раза — вынимаем их
    // из SVG и дорисовываем на канвасе сами.
    const pr = pageEl.getBoundingClientRect(), sigs = [];
    pageEl.querySelectorAll(".sigbox img, img.colo").forEach(im=>{
      const r = im.getBoundingClientRect();
      if(im.src && r.width && r.height) sigs.push({src:im.src, x:r.left-pr.left, y:r.top-pr.top, w:r.width, h:r.height});
    });
    const clone = pageEl.cloneNode(true);
    clone.querySelectorAll(".sigbox img, img.colo").forEach(im=>im.remove());
    box.appendChild(clone);
    wrap.appendChild(st); wrap.appendChild(box);
    const xml = new XMLSerializer().serializeToString(wrap);
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+BOX_W+'" height="'+BOX_H+'">' +
                '<foreignObject x="0" y="0" width="100%" height="100%">' + xml + '</foreignObject></svg>';
    const img = new Image();
    const loadSig = src => new Promise(res=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = ()=>res(null); i.src = src; });
    img.onload = async ()=>{
      try{
        const cv = document.createElement("canvas");
        cv.width = BOX_W*scale; cv.height = BOX_H*scale;
        const cx = cv.getContext("2d");
        cx.fillStyle = "#fff"; cx.fillRect(0,0,cv.width,cv.height);
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        for(const sg of sigs){
          const si = await loadSig(sg.src);
          if(si) cx.drawImage(si, sg.x*scale, sg.y*scale, sg.w*scale, sg.h*scale);
        }
        const d = cv.toDataURL("image/jpeg", 0.92).split(",")[1];
        const bin = atob(d), u = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
        resolve({bytes:u, w:cv.width, h:cv.height});
      }catch(e){ reject(e); }
    };
    img.onerror = ()=>reject(new Error("svg"));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}

function makePdf(imgs){
  const enc = new TextEncoder(), parts = [], offs = [];
  let len = 0;
  const push = b => { if(typeof b === "string") b = enc.encode(b); parts.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; push(n + " 0 obj\n"); push(body); push("\nendobj\n"); };
  const PW = 595.28, PH = 841.89, M = 34;           // A4, поля 12 мм
  const W = PW - 2*M, H = W * BOX_H / BOX_W;
  push("%PDF-1.4\n");
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  const kids = imgs.map((_,i)=> (3+3*i) + " 0 R").join(" ");
  obj(2, "<< /Type /Pages /Kids [" + kids + "] /Count " + imgs.length + " >>");
  imgs.forEach((im,i)=>{
    const pg = 3+3*i, ct = pg+1, ix = pg+2;
    obj(pg, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH + "] /Resources << /XObject << /Im0 " + ix + " 0 R >> >> /Contents " + ct + " 0 R >>");
    const c = "q " + W.toFixed(2) + " 0 0 " + H.toFixed(2) + " " + M + " " + (PH - M - H).toFixed(2) + " cm /Im0 Do Q";
    obj(ct, "<< /Length " + c.length + " >>\nstream\n" + c + "\nendstream");
    offs[ix] = len;
    push(ix + " 0 obj\n<< /Type /XObject /Subtype /Image /Width " + im.w + " /Height " + im.h +
         " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + im.bytes.length + " >>\nstream\n");
    push(im.bytes); push("\nendstream\nendobj\n");
  });
  const n = 3 + 3*imgs.length, xr = len;
  let x = "xref\n0 " + n + "\n0000000000 65535 f \n";
  for(let i=1;i<n;i++) x += String(offs[i]).padStart(10,"0") + " 00000 n \n";
  push(x + "trailer\n<< /Size " + n + " /Root 1 0 R >>\nstartxref\n" + xr + "\n%%EOF");
  return new Blob(parts, {type:"application/pdf"});
}

function showPdfSheet(blob, name){
  const old = document.getElementById("pdfSheet"); if(old) old.remove();
  const url = URL.createObjectURL(blob);
  const file = new File([blob], name, {type:"application/pdf"});
  const ov = document.createElement("div");
  ov.id = "pdfSheet";
  ov.style.cssText = "position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px";
  ov.innerHTML = '<div style="background:#fff;border-radius:16px;padding:18px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;font-family:-apple-system,Arial,sans-serif">' +
    '<b style="font-size:18px;color:#15181C">PDF готов</b>' +
    '<div style="font-size:13px;color:#6A727C;word-break:break-all">' + name + '</div>' +
    '<button class="btn primary" id="pdfShare" style="width:100%">Поделиться / Печать</button>' +
    '<button class="btn" id="pdfOpen" style="width:100%">Открыть PDF</button>' +
    '<button class="btn" id="pdfClose" style="width:100%">Закрыть</button></div>';
  document.body.appendChild(ov);
  const close = ()=>{ ov.remove(); setTimeout(()=>URL.revokeObjectURL(url), 60000); };
  ov.querySelector("#pdfClose").onclick = close;
  ov.querySelector("#pdfOpen").onclick = ()=>{ const w = window.open(url, "_blank"); if(!w) location.href = url; };
  ov.querySelector("#pdfShare").onclick = async ()=>{
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file]});
      else { const w = window.open(url, "_blank"); if(!w) location.href = url; }
    }catch(e){ if(e && e.name !== "AbortError") toast("Не вышло — жми «Открыть PDF»"); }
  };
}

let PDF_BUSY = false;
async function exportPdf(prefix){
  if(PDF_BUSY) return;
  PDF_BUSY = true;
  toast("Готовлю PDF…");
  try{
    await new Promise(r=>setTimeout(r,30));
    const pages = Array.from(document.querySelectorAll("#print .page"));
    const imgs = [];
    for(const pg of pages) imgs.push(await pageToJpeg(pg, 3));
    const nm = (prefix || "Karta") + "_" + ((C && C.name) || "drogowa").replace(/[^\wА-Яа-яЁё.-]+/g,"_") + ".pdf";
    showPdfSheet(makePdf(imgs), nm);
  }catch(e){
    toast("PDF не собрался — жми «Печать»");
  }finally{
    PDF_BUSY = false; PRINT_MODE = "card";
  }
}

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(reloaded) return; reloaded = true; location.reload();
  });
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"})
      .then(r=>{ r.update(); setInterval(()=>r.update(), 60000); })
      .catch(()=>{});
  });
}

(async function init(){
  let raw = await Store.get(KEY);
  let pend = null; try{ pend = localStorage.getItem(PEND); }catch(e){}
  if(pend){ raw = pend; }                 // не успели записать при закрытии — берём свежее
  if(raw){ try{ DB = unpackDB(raw); }catch(e){ DB={cards:[],active:""}; } }
  if(pend){ try{ await Store.set(KEY, pend); localStorage.removeItem(PEND); }catch(e){} }
  if(!DB.mycards) DB.mycards = {fuel:[], bank:[]};
  if(!DB.mycards.fuel) DB.mycards.fuel = [];
  if(!DB.mycards.bank) DB.mycards.bank = [];
  if(!DB.cards || !DB.cards.length){ const c=newCard(); DB={cards:[c], active:c.id}; }
  C = DB.cards.find(c=>c.id===DB.active) || DB.cards[0];
  DB.active = C.id;
  // добить недостающие поля после обновлений
  const base = newCard(); for(const k in base){ if(C[k]===undefined) C[k]=base[k]; }
  try{ syncLib(); }catch(e){}
  renderAll();
  $("#saveState").textContent = T("готово");
  maybeAutoBackup();
})();
