<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EFEDE7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Karta">
<title>Karta drogowa</title>
<style>
:root{
  --bg:#EFEDE7; --panel:#FFFFFF; --panel2:#FBFAF6; --line:#D3D6DB;
  --ink:#15181C; --dim:#6A727C; --amber:#B77400; --green:#2F7D4F; --red:#C6402A;
  --r:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
/* ---------- Top bar ---------- */
header{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.brand b{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:700}
.brand small{color:var(--dim);font-size:11px;letter-spacing:.08em;margin-left:auto}
.bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.bar::-webkit-scrollbar{display:none}
.btn{
  flex:0 0 auto;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;cursor:pointer;
}
.btn:active{background:#E4E2DB}
.btn.primary{background:var(--amber);color:#fff;border-color:var(--amber)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red)}
/* ---------- Tabs ---------- */
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px 0;position:sticky;top:0;z-index:40;background:var(--bg)}
nav::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:9px 13px;border-radius:10px 10px 0 0;background:transparent;
  border:1px solid transparent;border-bottom:none;color:var(--dim);font-size:14px;font-weight:600;cursor:pointer;
}
.tab.on{background:var(--panel);color:var(--amber);border-color:var(--line)}
main{padding:0 12px 90px}
section.pane{display:none}
section.pane.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0}
.card > h3{
  margin:0 0 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .full{grid-column:1/-1}
label.f{display:block}
label.f > span{display:block;font-size:11px;color:var(--dim);margin:0 0 3px 2px;letter-spacing:.03em}
input,textarea,select{
  width:100%;background:#FFFFFF;border:1px solid #C7CBD1;border-radius:10px;
  color:var(--ink);font:16px/1.2 inherit;padding:11px 10px;appearance:none;-webkit-appearance:none;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber)}
input[type=date],input[type=time]{min-height:44px}
textarea{min-height:90px;line-height:1.35}
.row2{display:flex;gap:6px}
.row2 > *{flex:1}
.mini{
  flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--amber);
  border-radius:9px;padding:0 10px;font-size:12px;font-weight:700;cursor:pointer;min-height:44px;
}
.mini:active{background:var(--panel2)}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
/* мягкая заливка строк: жёлтая — не закрыта, зелёная — заполнено всё */
.item[data-row].todo{background:#FFFFFF;border-color:#D3D6DB}
.item[data-row].done{background:#E4F2E8;border-color:#8CC5A2}
/* закрытая строка — белая полоска, как на бланке */
.rsum{display:none}
.item.done:not(.open){padding:8px}
.item.done:not(.open) .grid,.item.done:not(.open) .sub{display:none}
.item.done:not(.open) .ihead{margin-bottom:6px}
.item.done:not(.open) .rsum{display:block;background:#F4FBF6;color:#15181c;border:1px solid #A9D6BB;border-radius:6px;
  padding:6px 9px;font-size:12.5px;line-height:1.45;font-family:"Times New Roman",Georgia,serif;cursor:pointer}
.rsum b{font-weight:700}
.rsum .sep{color:#7a808a;padding:0 5px}
.item.done .ihead .rst::after{content:" ▾";font-weight:400}
.item.done.open .ihead .rst::after{content:" ▴"}
.rst{font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:999px;text-transform:uppercase}
.rst.done{color:#1F6B41}
.rst.todo{color:#8A5A00}
.item .ihead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.item .ihead b{font-size:12px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.item .ihead .del{margin-left:auto;background:transparent;border:none;color:var(--red);font-size:13px;font-weight:700;cursor:pointer;padding:4px 6px}
.sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:14px 0 4px 2px}
.hint{color:var(--dim);font-size:12px;line-height:1.5;margin:8px 2px}
.count{color:var(--dim);font-size:12px;margin-left:auto}
.add{width:100%;margin-top:6px;background:transparent;border:1px dashed var(--line);color:var(--amber);
  border-radius:12px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
.bkwarn{margin:10px 12px 0;padding:11px 12px;border-radius:12px;background:#FDF3DC;border:1px solid #E0BE72;
  color:#5A4413;font-size:13px;line-height:1.45;display:flex;gap:10px;align-items:center}
.bkwarn button{flex:0 0 auto;background:var(--amber);color:#fff;border:none;border-radius:9px;padding:9px 12px;font-weight:700;font-size:13px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
  background:var(--green);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;
  z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.instr{color:#2A3138;font-size:14px;line-height:1.55}
.instr li{margin:0 0 12px}
.instr h4{color:var(--amber);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}
.sigpad{width:100%;height:140px;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none;display:block;cursor:crosshair}
.sigwrap{margin:6px 0 12px}
.sigrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.sigrow .mini{min-height:38px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

.bkwarn{margin:10px 12px 0;padding:11px 12px;border-radius:12px;background:#FDF3DC;border:1px solid #E0BE72;
  color:#5A4413;font-size:13px;line-height:1.45;display:flex;gap:10px;align-items:center}
.bkwarn button{flex:0 0 auto;background:var(--amber);color:#fff;border:none;border-radius:9px;padding:9px 12px;font-weight:700;font-size:13px}

/* ================= PRINT SHEET (точная копия бланка) ================= */
#print{position:absolute;left:-99999px;top:0;width:680px;background:#fff;color:#000}
body.preview #print{position:static;left:auto;padding:10px 0}
body.preview main,body.preview nav,body.preview header{display:none}
.page{width:680px;height:880px;overflow:hidden;background:#fff;margin:0 auto 10px}
.sheet{
  width:680px;min-height:880px;background:#fff;
  font-family:"Times New Roman",Times,serif;color:#000;
  display:flex;flex-direction:column;overflow:hidden;
}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed}
.sheet td,.sheet th{border:1px solid #000;padding:1px 3px;vertical-align:middle;font-size:9pt;line-height:1.15;word-wrap:break-word}
.b{font-weight:bold}
.c{text-align:center}
.i{font-style:italic}
.nb td{border:none}
.val{font-family:"Courier New",monospace;font-size:8.5pt}
.h1{text-align:center;font-weight:bold;font-size:12pt;margin:0 0 6px}
.h2{text-align:center;font-weight:bold;font-style:italic;font-size:10.5pt;margin:8px 0 4px}
.decl{font-style:italic;font-weight:bold;text-decoration:underline;font-size:10pt;margin:8px 0 2px;text-align:center}
.trasa td{height:5.1mm;font-size:7.5pt}
.trasa th{font-size:7.5pt;font-weight:bold;text-align:center}
.tank{font-family:Arial,Helvetica,sans-serif}
.tank td,.tank th{font-size:8pt;height:5.2mm}
.tank th{font-weight:bold;text-align:center}
.lines{border:1px solid #000;padding:3px 5px}
.lines div{font-size:9pt;line-height:1.5;white-space:nowrap;overflow:hidden}
.dot{letter-spacing:.5px}
.sig{margin-top:auto;padding-top:6mm;display:flex;justify-content:space-between;align-items:flex-start;font-weight:bold;font-style:italic;font-size:10pt}
.sig > div{width:45%}
.sig .s2{margin-top:7mm}
.sig u{display:block;font-weight:normal;font-style:normal;margin-top:2px}
.sigbox{height:14mm;display:flex;align-items:flex-end}
.sigbox img{max-height:14mm;max-width:100%;display:block}
.note{font-size:9pt;font-weight:bold;margin-top:14px;line-height:1.35}
.rus{font-family:Arial,Helvetica,sans-serif;font-size:8pt;line-height:1.32}
.rus ul{margin:2mm 0 0;padding-left:6mm}
.rus li{margin-bottom:2.4mm;text-align:justify}
@media print{
  header,nav,main,.bkwarn,.toast{display:none!important}
  body{background:#fff}
  #print{position:static!important;left:auto!important;top:auto!important;padding:0!important;zoom:1!important}
  .page{margin:0;page-break-after:always;break-after:page;page-break-inside:avoid;break-inside:avoid}
  .page:last-child{page-break-after:auto;break-after:auto}
  @page{size:A4 portrait;margin:12mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand"><b>Karta drogowa</b><span style="color:var(--dim);font-size:11px">v13</span><small id="saveState">—</small></div>
  <div class="bar">
    <button class="btn primary" id="btnPrint">Печать / PDF</button>
    <button class="btn" id="btnPreview">Предпросмотр</button>
    <select id="cardSel" style="width:auto;min-width:150px;padding:9px 30px 9px 10px;font-size:14px"></select>
    <button class="btn" id="btnNew">Новая карта</button>
    <button class="btn ghost" id="btnRename">Переименовать</button>
    <button class="btn" id="btnShare">Копия ⤴</button>
    <button class="btn ghost" id="btnExport">Экспорт</button>
    <button class="btn ghost" id="btnImport">Импорт</button>
    <button class="btn ghost danger" id="btnDel">Удалить</button>
  </div>
</header>

<div id="bkWarn" class="bkwarn" style="display:none"></div>
<nav id="tabs"></nav>
<main>
  <section class="pane" id="pane-main"></section>
  <section class="pane" id="pane-trasa"></section>
  <section class="pane" id="pane-tank"></section>
  <section class="pane" id="pane-koszty"></section>
  <section class="pane" id="pane-info"></section>
</main>

<div id="print"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" style="display:none">

<script>
"use strict";

/* ================= Хранилище: работает и в приложении Claude, и в Safari ================= */
const Store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k,false); return r? r.value : null; } }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){}
    return (Store._m && Store._m[k]) || null;
  },
  async set(k,v){
    try{ if(window.storage){ await window.storage.set(k,v,false); return true; } }catch(e){}
    try{ localStorage.setItem(k,v); return true; }catch(e){}
    Store._m = Store._m || {}; Store._m[k]=v; return true;
  }
};
const KEY = "kd_v1";
const SNAP = "kd_snap_v1";   // копии внутри устройства
const LASTB = "kd_lastb_v1";  // когда последний раз выгружали файл

/* ================= Модель ================= */
const LIMITS = {trasa:30, tankON:17, tankAd:9, tankChl:3, zakupy:10, oplaty:10, serwisy:5, mandaty:3, wlasne:3};
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function newCard(name){
  return {
    id: uid(),
    name: name || ("Karta " + new Date().toLocaleDateString("ru-RU")),
    head:{nrWyjazdu:"",nrTeczki:"",nrRej:"",paliwo:"ON",k1i:"",k1n:"",k2i:"",k2n:""},
    bus:{wyjD:"",wyjG:"",przyjSamD:"",przyjSamG:"",miejsL:"",powrD:"",powrG:"",przyjBazD:"",przyjBazG:"",miejsP:""},
    baza:{wyjD:"",wyjG:"",powrD:"",powrG:""},
    stany:{kmP:"",kmK:"",palP:"",palK:"",kompP:"",kompK:"",adbP:"",adbK:""},
    trasa:[], tankON:[], tankAd:[], tankChl:[],
    zakupy:[], oplaty:[], serwisy:[], mandaty:[], wlasne:[],
    sig:{k1:"",k2:""},
    uwagi:"", printInstr:false
  };
}
const blank = {
  trasa:()=>({nr:"",zk:"",zm:"",zd:"",zg:"",zl:"",wk:"",wm:"",wd:"",wg:"",wl:"",waga:""}),
  tank:()=>({d:"",kraj:"",karta:"",litry:"",pelna:"",licznik:"",paragon:""}),
  tankChl:()=>({d:"",kraj:"",karta:"",rej:"",mgP:"",mgK:"",litry:""}),
  zakupy:()=>({co:"",d:"",bank:"",kwota:"",kraj:""}),
  oplaty:()=>({co:"",d:"",karta:"",kwota:"",kraj:""}),
  wlasne:()=>({co:"",d:"",kwota:"",kraj:"",kier:""})
};

let DB = {cards:[], active:""};
let C = null;                       // активная карта

/* ================= Утилиты ================= */
const $ = s=>document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function getP(o,p){ return p.split(".").reduce((a,k)=> (a==null?a:a[k]), o); }
function setP(o,p,v){ const k=p.split("."); const last=k.pop(); let t=o; k.forEach(x=> t=t[x]); t[last]=v; }
function fmtD(iso,short){ if(!iso) return ""; const [y,m,d]=iso.split("-"); if(!d) return iso;
  return short ? `${d}.${m}.${y.slice(2)}` : `${d}.${m}.${y}`; }
function fmtDT(iso,g,short){ const a=fmtD(iso,short), b=g||""; return (a||b)? `${a} / ${b}` : ""; }
function todayISO(){ const t=new Date(); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }
function nowHM(){ const t=new Date(); return String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0"); }
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1600); }

/* ================= Сохранение ================= */
let saveT;
function save(now){
  $("#saveState").textContent = "сохраняю…";
  clearTimeout(saveT);
  const go = async ()=>{
    await Store.set(KEY, JSON.stringify(DB));
    snapshot();
    $("#saveState").textContent = "сохранено " + nowHM();
  };
  if(now) go(); else saveT = setTimeout(go, 400);
}

/* ================= Определение страны/города по GPS ================= */
const BOX = [ /* [код, latMin, latMax, lonMin, lonMax] */
 ["LU",49.4,50.2,5.7,6.6],["SI",45.4,46.9,13.3,16.6],["BE",49.4,51.6,2.5,6.4],["NL",50.7,53.6,3.3,7.3],
 ["CH",45.8,47.9,5.9,10.5],["ME",41.8,43.6,18.4,20.4],["MK",40.8,42.4,20.4,23.0],["AL",39.6,42.7,19.2,21.1],
 ["DK",54.5,57.8,8.0,12.8],["BA",42.5,45.3,15.7,19.7],["SK",47.7,49.7,16.8,22.6],["CZ",48.5,51.1,12.0,18.9],
 ["HU",45.7,48.6,16.1,22.9],["AT",46.3,49.1,9.5,17.2],["HR",42.3,46.6,13.4,19.5],["RS",42.2,46.2,18.8,23.0],
 ["LT",53.9,56.5,20.9,26.9],["LV",55.6,58.1,20.9,28.3],["EE",57.5,59.7,21.7,28.2],["MD",45.4,48.5,26.6,30.2],
 ["PL",49.0,54.9,14.1,24.2],["DE",47.2,55.1,5.8,15.1],["FR",42.3,51.1,-5.2,8.3],["IT",36.6,47.1,6.6,18.6],
 ["ES",36.0,43.8,-9.4,3.4],["PT",36.9,42.2,-9.6,-6.1],["GB",49.9,58.7,-8.2,1.8],["IE",51.4,55.4,-10.6,-5.9],
 ["NO",57.9,71.2,4.6,31.1],["SE",55.3,69.1,11.0,24.2],["FI",59.7,70.1,20.5,31.6],["BY",51.2,56.2,23.1,32.8],
 ["UA",44.3,52.4,22.1,40.2],["RO",43.6,48.3,20.2,29.7],["BG",41.2,44.2,22.3,28.6],["GR",34.8,41.8,19.3,28.3],
 ["TR",35.8,42.1,25.6,44.8],["RU",41.2,77.0,19.6,180.0]
].sort((a,b)=> ((a[2]-a[1])*(a[4]-a[3])) - ((b[2]-b[1])*(b[4]-b[3])));

function countryByCoords(lat,lon){
  for(const b of BOX){ if(lat>=b[1]&&lat<=b[2]&&lon>=b[3]&&lon<=b[4]) return b[0]; }
  return "";
}
function gps(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error("Геолокация недоступна"));
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude, lon:p.coords.longitude}),
      e=>rej(e), {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
  });
}
/* кириллица -> латиница (резерв, если у города нет латинского имени) */
const TR={"а":"a","б":"b","в":"v","г":"h","ґ":"g","д":"d","е":"e","є":"ie","ж":"zh","з":"z","и":"y","і":"i","ї":"i","й":"i","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"shch","ъ":"","ы":"y","ь":"","э":"e","ю":"iu","я":"ia","ё":"e"};
function translit(s){
  return s.split("").map(ch=>{
    const low=ch.toLowerCase(), t=TR[low];
    if(t===undefined) return ch;
    return (ch===low) ? t : (t.charAt(0).toUpperCase()+t.slice(1));
  }).join("");
}

async function placeNow(){
  const {lat,lon} = await gps();
  let kraj = countryByCoords(lat,lon), city = "";
  try{
    const ctl = new AbortController(); const t=setTimeout(()=>ctl.abort(),4500);
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&namedetails=1&accept-language=en&lat=${lat}&lon=${lon}`,{signal:ctl.signal});
    clearTimeout(t);
    if(r.ok){ const j = await r.json(); const a=j.address||{}, n=j.namedetails||{};
      if(a.country_code) kraj = a.country_code.toUpperCase();
      /* 1) местное название (Warszawa, Munchen, Kosice) */
      let c = n.name || "";
      /* 2) если местное кириллицей (UA, BY, RS, BG, RU) — берём латиницу */
      if(!c || /[\u0400-\u04FF]/.test(c)) c = n["name:pl"] || n["name:en"] || n["name:de"] || c;
      /* 3) последний резерв — англ. поля адреса */
      if(!c) c = a.city||a.town||a.village||a.municipality||a.county||"";
      /* 4) если всё равно кириллица — транслит */
      city = /[\u0400-\u04FF]/.test(c) ? translit(c) : c;
    }
  }catch(e){ /* офлайн — остаётся определение по координатам */ }
  return {kraj, city, lat, lon};
}

/* ================= Конструкторы полей ================= */
function inp(path,label,type,extra){
  const v = esc(getP(C,path));
  const t = type||"text";
  const attrs = extra||"";
  return `<label class="f"><span>${esc(label)}</span><input type="${t}" data-p="${path}" value="${v}" ${attrs}></label>`;
}
function dateF(path,label){ return `<label class="f"><span>${esc(label)}</span>

/* --------- Подпись пальцем --------- */
function initSigs(){
  document.querySelectorAll("canvas[data-sig]").forEach(cv=>{
    const path = cv.dataset.sig;
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const w = cv.clientWidth || 300, h = 140;
    cv.width = w*dpr; cv.height = h*dpr;
    const ctx = cv.getContext("2d");
    ctx.scale(dpr,dpr);
    ctx.lineWidth = 2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#0E1418";
    const saved = getP(C,path);
    if(saved){ const img = new Image(); img.onload = ()=> ctx.drawImage(img,0,0,w,h); img.src = saved; }
    let drawing=false, last=null;
    const pos = e =>{ const r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
    cv.addEventListener("pointerdown", e=>{
      e.preventDefault(); drawing=true; last=pos(e);
      try{ cv.setPointerCapture(e.pointerId); }catch(err){}
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(last.x+0.1,last.y); ctx.stroke();
    });
    cv.addEventListener("pointermove", e=>{
      if(!drawing) return; e.preventDefault();
      const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p;
    });
    const end = ()=>{ if(!drawing) return; drawing=false;
      setP(C, path, cv.toDataURL("image/png")); save(); };
    cv.addEventListener("pointerup", end);
    cv.addEventListener("pointercancel", end);
    cv.addEventListener("pointerleave", end);
  });
}

const ROW_RULES = {
  trasa:  r => { const zag = r.zk&&r.zm&&r.zd, wyl = r.wk&&r.wm&&r.wd; return {full: !!(zag&&wyl), label: zag&&wyl ? "готово" : (zag?"нет выгрузки":(wyl?"нет загрузки":"неполно"))}; },
  tankON: r => ({full: !!(r.d&&r.kraj&&r.litry), label:"готово"}),
  tankAd: r => ({full: !!(r.d&&r.kraj&&r.litry), label:"готово"}),
  tankChl:r => ({full: !!(r.d&&r.litry), label:"готово"}),
  _cost:  r => ({full: !!(r.co&&r.d&&r.kwota), label:"готово"})
};
function rowSummary(list, r){
  const S = '<span class="sep">|</span>';
  const g = (...a)=>a.filter(Boolean).map(esc).join(" ");
  if(list==="trasa"){
    return `<b>${esc(r.nr)||"—"}</b>${S}Z: ${g(r.zk,r.zm,r.zd,r.zg)}${S}W: ${g(r.wk,r.wm,r.wd,r.wg)}` + (r.waga?`${S}${esc(r.waga)}`:"");
  }
  if(list==="tankChl") return `${g(r.d,r.kraj)}${S}chłodnia ${esc(r.rej)||""}${S}<b>${esc(r.litry)} L</b>`;
  if(list==="tankON"||list==="tankAd") return `${g(r.d,r.kraj)}${S}${esc(r.karta)||"—"}${S}<b>${esc(r.litry)} L</b>` + (r.licznik?`${S}${esc(r.licznik)} km`:"");
  return `${g(r.d,r.kraj)}${S}${esc(r.co)||"—"}${S}<b>${esc(r.kwota)}</b>`;
}

function paintRow(el){
  const [list,i] = (el.dataset.row||"").split("|");
  const r = (C[list]||[])[+i]; if(!r) return;
  const any = Object.values(r).some(v => v!=="" && v!==false && v!=null);
  const rule = ROW_RULES[list] || ROW_RULES._cost;
  const st = rule(r);
  el.classList.toggle("done", st.full);
  el.classList.toggle("todo", !st.full);
  const b = el.querySelector(".rst");
  if(b){
    b.className = "rst" + (st.full ? " done" : " todo");
    b.textContent = st.full ? "готово" : (any ? st.label : "пусто");
  }
  const sm = el.querySelector(".rsum");
  if(sm && st.full) sm.innerHTML = rowSummary(list, r);
}
function paintRows(){ document.querySelectorAll(".item[data-row]").forEach(paintRow); }

async function fillBackupInfo(){

  const d = daysSinceBackup();
  st.textContent = !lastBackupTs ? "Копия ещё ни разу не сохранялась."

async function restoreSnap(i){
  if(!confirm("Восстановить состояние из копии? Текущие карты будут заменены.")) return;
  try{
    const raw = await Store.get(SNAP); const box = JSON.parse(raw);
    const item = box.items[i]; if(!item) return;
    await snapshot();
    DB = JSON.parse(item.data);
    C = DB.cards.find(c=>c.id===DB.active) || DB.cards[0];
    DB.active = C.id;
    save(true); renderAll(); toast("Восстановлено");
  }catch(e){ toast("Не удалось восстановить"); }
}

/* Каждый лист ужимается ровно под один A4, чтобы всегда было 4 страницы */
const BOX_W = 680, BOX_H = 880;
function fitPages(){
  document.querySelectorAll("#print .sheet").forEach(sh=>{
    sh.style.zoom = 1;
    sh.style.width = BOX_W + "px";
    sh.style.minHeight = BOX_H + "px";
    const H = sh.scrollHeight;
    let s = H > 0 ? Math.min(1, BOX_H / H) : 1;
    if(s < 1){
      s = s * 0.98;
      sh.style.width = (BOX_W / s) + "px";
      sh.style.minHeight = (BOX_H / s) + "px";
      sh.style.zoom = s;
    }
  });
}

/* ================= Резервные копии ================= */
const DAY = 86400000;

// Снимок всех карт внутри устройства (хранится 3 последних)
async function snapshot(){
  try{
    let box = {items:[]};
    const raw = await Store.get(SNAP);
    if(raw){ try{ box = JSON.parse(raw); }catch(e){} }
    const now = Date.now();
    const last = box.items[0];
    if(last && (now - last.t) < 6*3600000) box.items.shift(); // не чаще раза в 6 часов
    box.items.unshift({t: now, data: JSON.stringify(DB)});
    box.items = box.items.slice(0,3);
    await Store.set(SNAP, JSON.stringify(box));
  }catch(e){}
}

function backupBlob(){
  return new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
}
function backupName(){ return "karta-" + todayISO() + ".json"; }

async function saveBackupFile(silent){
  try{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(backupBlob());
    a.download = backupName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    await Store.set(LASTB, String(Date.now()));
    if(!silent) toast("Копия сохранена в Загрузки");
    renderWarn();
    return true;
  }catch(e){ return false; }
}

// Отправить копию в облако/мессенджер одним тапом
async function shareBackup(){
  const file = new File([backupBlob()], backupName(), {type:"application/json"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Karta drogowa — копия"});
      await Store.set(LASTB, String(Date.now()));
      renderWarn();
      return;
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  saveBackupFile();
}

let lastBackupTs = 0;
async function loadBackupState(){
  const v = await Store.get(LASTB);
  lastBackupTs = v ? Number(v) : 0;
}
function daysSinceBackup(){
  if(!lastBackupTs) return 999;
  return Math.floor((Date.now() - lastBackupTs) / DAY);
}
function hasData(){
  return DB.cards.some(c => c.trasa.length || c.tankON.length || c.head.nrWyjazdu || c.baza.wyjD);
}
function renderWarn(){
  const el = $("#bkWarn");
  if(!el) return;
  const d = daysSinceBackup();
  if(!hasData() || d < 3){ el.style.display = "none"; return; }
  el.style.display = "flex";
  el.innerHTML = `<div>Копии карты нет ${d>90?"ни разу":"уже "+d+" дн."}. Если планшет пропадёт — данные пропадут вместе с ним.</div>
    <button id="warnBk">Сделать</button>`;
}

// Раз в сутки сама выгружает файл в Загрузки
async function maybeAutoBackup(){
  await loadBackupState();
  renderWarn();
  if(!hasData()) return;
  if(Date.now() - lastBackupTs > DAY){
    const ok = await saveBackupFile(true);
    if(ok){ lastBackupTs = Date.now(); toast("Копия сохранена в Загрузки"); }
  }
}

  if(t.dataset.tab){ activeTab = t.dataset.tab; renderTabs();
    if(activeTab==="main") initSigs();
    window.scrollTo({top:0}); return; }

  if(t.dataset.now){
    const [kind,p1,p2] = t.dataset.now.split("|");
    if(kind==="d") setP(C,p1,todayISO());
    if(kind==="t") setP(C,p1,nowHM());
    if(kind==="dt"){ setP(C,p1,todayISO()); setP(C,p2,nowHM()); }
    const box = t.closest("label") || t.closest(".row2");
    box.querySelectorAll("input").forEach(i=>{ const p=i.dataset.p; if(p) i.value = getP(C,p)||""; });
    save(); toast("Дата и время подставлены"); return;
  }

  if(t.dataset.gps){
    const [pk,pm] = t.dataset.gps.split("|");
    const old = t.textContent; t.textContent="…"; t.disabled=true;
    try{
      const r = await placeNow();
      if(pk) setP(C,pk,r.kraj);
      if(pm && r.city) setP(C,pm,r.city);
      const box = t.closest("label")||t.closest(".row2");
      box.querySelectorAll("input").forEach(i=>{ const p=i.dataset.p; if(p) i.value = getP(C,p)||""; });
      save();
      toast(r.city ? `${r.kraj}, ${r.city}` : (r.kraj? `Страна: ${r.kraj}` : "Страна не определена"));
    }catch(err){
      toast("Нет доступа к геолокации");
    }
    t.textContent=old; t.disabled=false; return;
  }

  if(t.id === "warnBk" || t.id === "btnShare2"){ shareBackup(); return; }
  if(t.dataset.snap !== undefined){ restoreSnap(+t.dataset.snap); return; }

  if(t.dataset.sigclear){
    setP(C, t.dataset.sigclear, ""); save(); renderMain(); toast("Подпись очищена"); return;
  }

  if(t.dataset.add){
    const list = t.dataset.add;
    if(C[list].length >= LIMITS[list]){ toast(`На бланке ${LIMITS[list]} строк — больше не влезет`); return; }
    const mk = list==="trasa"?blank.trasa : (list==="tankON"||list==="tankAd")?blank.tank :
               list==="tankChl"?blank.tankChl : list==="zakupy"?blank.zakupy :
               list==="wlasne"?blank.wlasne : blank.oplaty;
    C[list].push(mk()); save();
    if(list==="trasa") renderTrasa(); else if(list.startsWith("tank")) renderTank(); else renderKoszty();
    paintRows();
    return;
  }

  if(t.dataset.del){
    const [list,i] = t.dataset.del.split("|");
    if(!confirm("Удалить запись?")) return;
    C[list].splice(+i,1); save();
    if(list==="trasa") renderTrasa(); else if(list.startsWith("tank")) renderTank(); else renderKoszty();
    paintRows();
    return;
  }

  switch(t.id){
    case "btnPrint": buildPrint(); setTimeout(()=>window.print(),120); break;
    case "btnPreview": buildPrint(); document.body.classList.toggle("preview");
      if(document.body.classList.contains("preview")){
        $("#print").style.zoom = Math.min(1, (window.innerWidth-12)/BOX_W);
        t.textContent="Закрыть просмотр"; window.scrollTo({top:0});
      } else { $("#print").style.zoom = ""; t.textContent="Предпросмотр"; } break;
    case "btnNew": { const n = prompt("Название новой карты:", "Karta " + new Date().toLocaleDateString("ru-RU"));
      if(n===null) return; const c = newCard(n.trim()); DB.cards.push(c); DB.active=c.id; C=c; save(true); renderAll(); toast("Карта создана"); break; }
    case "btnRename": { const n = prompt("Название карты:", C.name); if(n===null) return; C.name=n.trim()||C.name; save(true); renderCards(); break; }
    case "btnDel": { if(DB.cards.length<2){ toast("Это единственная карта"); return; }
      if(!confirm(`Удалить «${C.name}»? Данные пропадут.`)) return;
      DB.cards = DB.cards.filter(c=>c.id!==C.id); C = DB.cards[0]; DB.active=C.id; save(true); renderAll(); break; }
    case "btnExport": saveBackupFile(); break;
    case "btnShare": shareBackup(); break;
    case "btnImport": $("#fileIn").click(); break;
  }
});

$("#cardSel").addEventListener("change", e=>{
  const c = DB.cards.find(x=>x.id===e.target.value); if(!c) return;
  DB.active=c.id; C=c; save(true); renderAll(); window.scrollTo({top:0});
});

$("#fileIn").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{
      const data = JSON.parse(r.result);
      const list = Array.isArray(data.cards) ? data.cards : [data];
      let added = 0;
      list.forEach(c=>{
        const base = newCard();
        const card = Object.assign(base, c, {id: uid()});
        card.name = (c.name || "Импорт");
        DB.cards.push(card); added++;
      });
      if(added){
        C = DB.cards[DB.cards.length-1]; DB.active = C.id;
        save(true); renderAll(); toast(added>1 ? `Загружено карт: ${added}` : "Карта загружена");
      }
    }catch(err){ toast("Файл не читается"); } };
  r.readAsText(f); e.target.value="";
});

window.addEventListener("beforeprint", buildPrint);

/* ================= Офлайн ================= */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(reloaded) return; reloaded = true; location.reload();
  });
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"})
      .then(r=>{ r.update(); setInterval(()=>r.update(), 60000); })
      .catch(()=>{});
  });
}

/* ================= Старт ================= */
(async function init(){
  const raw = await Store.get(KEY);
  if(raw){ try{ DB = JSON.parse(raw); }catch(e){ DB={cards:[],active:""}; } }
  if(!DB.cards || !DB.cards.length){ const c=newCard(); DB={cards:[c], active:c.id}; }
  C = DB.cards.find(c=>c.id===DB.active) || DB.cards[0];
  DB.active = C.id;
  // добить недостающие поля после обновлений
  const base = newCard(); for(const k in base){ if(C[k]===undefined) C[k]=base[k]; }
  renderAll();
  $("#saveState").textContent = "готово";
  maybeAutoBackup();
})();
</script>
</body>
</html>
